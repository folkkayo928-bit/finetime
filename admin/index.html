<script>
(function(){
  const STORAGE_KEY='finetime_admin_session_v1';
  function read(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}}
  function write(v){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(v))}catch{}}
  async function json(res){
    const text=await res.text(); let data=null;
    try{data=text?JSON.parse(text):null}catch{}
    if(!res.ok){
      const msg=data?.msg||data?.message||data?.error_description||data?.error||text||('HTTP '+res.status);
      const e=new Error(msg); e.status=res.status; e.data=data; throw e;
    }
    return data;
  }
  async function refresh(session){
    if(!session?.refresh_token) return null;
    const res=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{apikey:K,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:session.refresh_token})
    });
    const data=await json(res);
    const next={access_token:data.access_token,refresh_token:data.refresh_token||session.refresh_token,expires_at:Date.now()+Number(data.expires_in||3600)*1000,user:data.user||session.user};
    write(next); return next;
  }
  async function session(){
    let v=read();
    if(!v?.access_token) return null;
    if(v.expires_at && v.expires_at<Date.now()+30000){
      try{v=await refresh(v)}catch{localStorage.removeItem(STORAGE_KEY);return null}
    }
    return v;
  }
  async function authFetch(path,opts={}){
    const sess=await session();
    const headers=Object.assign({apikey:K,'Content-Type':'application/json'},opts.headers||{});
    if(sess?.access_token) headers.Authorization='Bearer '+sess.access_token;
    const res=await fetch(U+path,Object.assign({},opts,{headers}));
    return json(res);
  }
  class Query{
    constructor(table){this.table=table;this.method='GET';this.selectValue='*';this.filters=[];this.orders=[];this.limitValue=null;this.body=null;this.expect='many';this.executed=false;this.upsertValue=false;this.onConflict=null}
    select(value='*'){this.selectValue=value;this.wantReturn=true;return this}
    eq(k,v){this.filters.push([k,'eq',v]);return this}
    is(k,v){this.filters.push([k,'is',v]);return this}
    order(k,o={}){this.orders.push([k,o]);return this}
    limit(n){this.limitValue=n;return this}
    maybeSingle(){this.expect='maybe';return this}
    single(){this.expect='single';return this}
    insert(body){this.method='POST';this.body=body;return this}
    upsert(body,opts={}){this.method='POST';this.body=body;this.upsertValue=true;this.onConflict=opts.onConflict||null;return this}
    update(body){this.method='PATCH';this.body=body;return this}
    delete(){this.method='DELETE';return this}
    async execute(){
      if(this.executed)return this.result;
      this.executed=true;
      const qs=new URLSearchParams();
      if(this.method==='GET'||this.wantReturn) qs.set('select',this.selectValue);
      for(const [k,op,v] of this.filters){
        qs.set(k,op+'.'+(v===null?'null':String(v)));
      }
      for(const [k,o] of this.orders){
        qs.append('order',k+'.'+(o.ascending===false?'desc':'asc'));
      }
      if(this.limitValue!==null) qs.set('limit',String(this.limitValue));
      let path='/rest/v1/'+encodeURIComponent(this.table);
      const queryStr=qs.toString();
      if(queryStr) path+='?'+queryStr;
      const headers={};
      if(this.wantReturn && this.method!=='GET') headers['Prefer']='return=representation';
      if(this.upsertValue && this.onConflict) headers['Prefer']='resolution=merge-duplicates';
      const opts={method:this.method,headers};
      if(this.body!==null) opts.body=JSON.stringify(this.body);
      try{
        let data=await authFetch(path,opts);
        if(this.expect==='single') data=Array.isArray(data)?data[0]:data;
        if(this.expect==='maybe') data=Array.isArray(data)?(data[0]||null):data;
        this.result={data,error:null};
      }catch(error){
        this.result={data:null,error};
      }
      return this.result;
    }
    then(onFulfill,onReject){return this.execute().then(onFulfill,onReject)}
  }
  function createClient(url,key){
    globalThis.U=url; globalThis.K=key;
    return {
      auth:{
        async signInWithPassword({email,password}){
          try{
            const res=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
            const data=await json(res);
            const sess={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+Number(data.expires_in||3600)*1000,user:data.user};
            write(sess); return {data:{session:sess,user:data.user},error:null};
          }catch(error){return {data:{session:null,user:null},error}}
        },
        async getSession(){try{return {data:{session:await session()},error:null}}catch(error){return {data:{session:null},error}}},
        async signOut(){localStorage.removeItem(STORAGE_KEY);return {error:null}},
        async resetPasswordForEmail(email,{redirectTo}={}){try{const res=await fetch(U+'/auth/v1/recover',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:redirectTo||location.href.split('#')[0]})});return {data:null,error:res.ok?null:await json(res)}}catch(error){return {data:null,error}}},
        async updateUser(attributes){try{const sess=await session();if(!sess?.access_token)throw new Error('Your admin session has expired.');const res=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify(attributes)});const data=await json(res);return {data:{user:data},error:null}}catch(error){return {data:null,error}}},
        async recoverFromHash(){const p=new URLSearchParams((location.hash||'').replace(/^#/,'').replace(/^\?/,'') );const access=p.get('access_token'),refreshToken=p.get('refresh_token');if(!access||!refreshToken)return null;const expires=Number(p.get('expires_in')||3600);const res=await fetch(U+'/auth/v1/user',{headers:{apikey:K,Authorization:'Bearer '+access}});const user=await json(res);const sess={access_token:access,refresh_token:refreshToken,expires_at:Date.now()+expires*1000,user};write(sess);history.replaceState(null,'',location.pathname+location.search);return sess}
      },
      from(table){return new Query(table)},
      async rpc(name,args={}){try{const sess=await session();if(!sess?.access_token)throw new Error('Your admin session has expired.');const res=await fetch(U+'/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',headers:{apikey:K,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify(args)});const data=await json(res);return {data,error:null}}catch(error){return {data:null,error}}}
    };
  }
  globalThis.supabase={createClient};
})();
</script>

<script>

const KEY='sb_publishable_CxfreIiozKEB-GcvNOCyhQ_RVnIgGVG';

const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const csv=x=>String(x||'').split(',').map(v=>v.trim()).filter(Boolean);

let activeTabName='businesses';
function switchTab(name,fn){
  activeTabName=name;
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    if(btn.dataset.tab===name) btn.classList.add('active');
    else btn.classList.remove('active');
  });

async function login(){
  const emailEl=document.getElementById('email');
  const passEl=document.getElementById('pass');
  const errEl=document.getElementById('err');
  const statusEl=document.getElementById('sessionStatus');
  const button=document.querySelector('#login .btn-primary');

  errEl.classList.add('hidden');
  errEl.textContent='';
  const emailValue=emailEl.value.trim(),passwordValue=passEl.value;
  if(!emailValue||!passwordValue){
    errEl.textContent='Enter both your email and password.';
    errEl.classList.remove('hidden');
    return;
  }
  if(button){button.disabled=true;button.textContent='Authenticating…';}
  statusEl.textContent='Signing in…';
  try{
    const r=await withTimeout(s.auth.signInWithPassword({email:emailValue,password:passwordValue}),'Sign-in request');
    if(r.error){
      errEl.textContent=r.error.message;
      errEl.classList.remove('hidden');
      statusEl.textContent='Sign-in failed';
      return;
    }
    statusEl.textContent='Admin active';
    await boot();
  }catch(e){
    errEl.textContent=e.message||'Sign-in failed. Please try again.';
    errEl.classList.remove('hidden');
    statusEl.textContent='Sign-in failed';
  }finally{
    if(button){button.disabled=false;button.textContent='Sign in to Console';}
  }
}

async function logout(){
  await s.auth.signOut();
  location.reload();
}

async function forgotPassword(){
  const email=document.getElementById('email').value.trim();
  if(!email)return alert('Enter your admin email first.');
  const productionRedirect='https://finetime.folkkayo928.workers.dev/';
  const r=await s.auth.resetPasswordForEmail(email,{redirectTo:productionRedirect});
  if(r.error)alert(r.error.message);
  else alert('Password reset email sent. Follow the link to return here and complete the reset with your Admin Security PIN.');
}

async function withTimeout(p,label='Request'){
  return await Promise.race([
    p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+' timed out. Check your connection and try again.')),10000))
  ]);
}

async function boot(){
  const loginEl=document.getElementById('login');
  const appEl=document.getElementById('app');
  const statusEl=document.getElementById('sessionStatus');
  const errEl=document.getElementById('err');
  try{
    statusEl.textContent='Checking session…';
    const {data:{session},error:sessionError}=await withTimeout(s.auth.getSession(),'Session check');
    if(sessionError)throw sessionError;
    const user=session?.user;
    if(!user){
      loginEl.classList.remove('hidden');
      appEl.classList.add('hidden');
      statusEl.textContent='Sign in required';
      return;
    }
    const r=await withTimeout(s.from('admin_memberships').select('role').eq('user_id',user.id).maybeSingle(),'Admin access check');
    if(r.error)throw r.error;
    if(r.data?.role!=='admin'){
      await s.auth.signOut();
      loginEl.classList.remove('hidden');
      appEl.classList.add('hidden');
      statusEl.textContent='Unauthorized';
      errEl.textContent='No admin membership is currently assigned to this account.';
      errEl.classList.remove('hidden');
      return;
    }
    loginEl.classList.add('hidden');
    appEl.classList.remove('hidden');
    statusEl.textContent='Active Session ('+esc(user.email||'Admin')+')';
    errEl.classList.add('hidden');
    await businesses();
  }catch(e){
    loginEl.classList.remove('hidden');
    appEl.classList.add('hidden');
    statusEl.textContent='Verification failed';
    errEl.textContent=e.message||'Admin request failed.';
    errEl.classList.remove('hidden');
  }
}

function filterBusinesses(){
  const q=(document.getElementById('bizSearch')?.value||'').toLowerCase().trim();
  const filtered=businessRows.filter(b=>{
    if(!q) return true;
    return [b.name,b.category,b.about,b.phone].filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  
  const container=document.getElementById('businessContainer');
  if(!container) return;

  if(!filtered.length){
    container.innerHTML='<div class="card muted" style="text-align:center;padding:40px 20px;">No businesses match your search.</div>';
    return;
  }

  container.innerHTML=filtered.map(b=>{
    const categoryName=(b.category||'hospitality').toUpperCase();
    const coverUrl=b.cover_url||'';
    const statusBadge=b.is_published
      ? '<span class="badge-pill badge-published">● Published</span>'
      : '<span class="badge-pill badge-hidden">○ Hidden</span>';

    return '<div class="card biz-row-card" data-business-id="'+esc(b.id)+'">'+
      (coverUrl
        ? '<img class="biz-thumb" src="'+esc(coverUrl)+'" alt="'+esc(b.name)+'" onerror="this.src=\'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=200&q=80\'">'
        : '<div class="biz-thumb" style="display:grid;place-items:center;font-size:24px;color:var(--gold);">🏨</div>')+
      '<div class="biz-info">'+
        '<div class="biz-name">'+
          '<span>'+esc(b.name)+'</span>'+
          '<span class="badge-pill badge-gold">'+esc(categoryName)+'</span>'+
          statusBadge+
        '</div>'+
        '<p class="biz-desc">'+esc(b.about||'Verified FineTime partner.')+'</p>'+
        '<div class="actions">'+
          '<button class="btn-primary" style="padding:6px 14px;font-size:12px;" type="button" data-business-action="edit" data-id="'+esc(b.id)+'">✏️ Edit Profile</button>'+
          '<button class="btn-secondary" style="padding:6px 14px;font-size:12px;" type="button" data-business-action="publish" data-id="'+esc(b.id)+'">'+(b.is_published?'Hide from App':'Publish Live')+'</button>'+
          '<button class="btn-danger" style="padding:6px 14px;font-size:12px;" type="button" data-business-action="delete" data-id="'+esc(b.id)+'">🗑️ Delete</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  container.querySelectorAll('[data-business-action]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.id,action=btn.dataset.businessAction,b=businessRows.find(x=>String(x.id)===String(id));
      if(!b)return;
      if(action==='edit'){await businessForm(encodeURIComponent(JSON.stringify(b)));return;}
      if(action==='publish'){await setBusinessPublished(id,!b.is_published,btn);return;}
      if(action==='delete'){await delBusiness(id,btn);return;}
    });
  });
}

async function saveBusinessForm(event,id){
  event.preventDefault();
  const form=event.currentTarget,fd=new FormData(form),lines=n=>String(fd.get(n)||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  const businessPayload={
    name:String(fd.get('name')||'').trim(),
    category:String(fd.get('category')||'restaurant'),
    city_id:String(fd.get('city_id')||'')||null,
    about:String(fd.get('about')||'').trim()||null,
    is_published:fd.get('is_published')==='on',
    phone:String(fd.get('phone')||'').trim()||null,
    cover_url:String(fd.get('cover_url')||'').trim()||null,
    gallery_urls:lines('gallery_urls'),
    highlights:lines('highlights'),
    amenities:lines('amenities')
  };
  if(!businessPayload.name)return alert('Business name is required.');
  const button=form.querySelector('button[type="submit"]');
  if(button){button.disabled=true;button.textContent='Saving…';}
  try{
    let businessId=id;
    const profilePayload={business_id:id,menu_slug:String(fd.get('menu_slug')||'').trim()||null,tagline:String(fd.get('tagline')||'').trim()||null,currency:String(fd.get('currency')||'ETB'),address:String(fd.get('address')||'').trim()||null,logo_url:String(fd.get('logo_url')||'').trim()||null};
    if(id){
      const r=await s.from('businesses').update(businessPayload).eq('id',id);
      if(r.error)throw r.error;
      await s.from('business_admin_profiles').upsert(profilePayload,{onConflict:'business_id'});
    }else{
      const r=await s.from('businesses').insert(businessPayload).select('id').single();
      if(r.error)throw r.error;
      businessId=r.data.id;
      profilePayload.business_id=businessId;
      await s.from('business_admin_profiles').upsert(profilePayload,{onConflict:'business_id'});
    }
    alert(id?'Business updated successfully!':'Business created successfully!');
    await businesses();
  }catch(e){
    alert(e.message||'Could not save business.');
  }finally{
    if(button){button.disabled=false;button.textContent=id?'Save Changes':'Create Business';}
  }
}

async function delBusiness(id,button){
  if(!confirm('Are you sure you want to delete this business? This action cannot be undone.'))return;
  if(button)button.disabled=true;
  try{
    const r=await s.from('businesses').delete().eq('id',id).select('id').maybeSingle();
    if(r.error)throw r.error;
    await businesses();
    businessStatus('Business deleted successfully.',true);
  }catch(e){
    businessStatus(e.message||'Delete action failed.');
  }finally{
    if(button)button.disabled=false;
  }
}

            '</div>'+

        }).join('')

async function makeCode(){
  const r=await s.from('businesses').select('id,name').order('name');
  if(r.error)return alert(r.error.message);
  if(!r.data?.length)return alert('Create a business first.');
  view.innerHTML=
    '<div class="formHead">'+
      '<div><h2>Generate Activation Code</h2><p class="muted">Create an onboarding connection code for a partner.</p></div>'+
      '<button class="btn-secondary" type="button" onclick="codes()">← Back</button>'+
    '</div>'+
    '<form id="codeEditor" class="formSection" onsubmit="return generateCode(event)">'+
      '<div class="formGrid">'+
        '<div class="field"><label>Business Partner *</label><select name="business_id" required>'+r.data.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('')+'</select></div>'+
        '<div class="field"><label>Valid for (Hours) *</label><input name="hours" type="number" min="1" max="8760" value="168" required><span class="help">Default is 168 hours (7 days).</span></div>'+
      '</div>'+
      '<div class="formActions"><button class="btn-primary" type="submit">Generate Code</button><button class="btn-secondary" type="button" onclick="codes()">Cancel</button></div>'+
    '</form>';
}

async function generateCode(event){
  event.preventDefault();
  const fd=new FormData(event.currentTarget),businessId=String(fd.get('business_id')||''),hours=Math.max(1,Math.min(8760,Number(fd.get('hours')||168)));
  const raw=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[x%36]).join('');
  const code='FT-'+raw.slice(0,6)+'-'+raw.slice(6);
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));
  const hash=Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
  const saveResult=await s.from('activation_codes').insert({business_id:businessId,code_hash:hash,expires_at:new Date(Date.now()+hours*3600000).toISOString()});
  if(saveResult.error)return alert(saveResult.error.message);
  const businessName=event.currentTarget.querySelector('select option:checked')?.textContent||'Selected business';
  view.innerHTML=
    '<div class="card" style="text-align:center;padding:40px 24px;">'+
      '<div class="badge-pill badge-published" style="margin-bottom:12px;">CODE ACTIVE</div>'+
      '<h2>Activation Code Generated</h2>'+
      '<p class="muted">'+esc(businessName)+' · valid for '+hours+' hours</p>'+
      '<div style="font-size:32px;font-weight:900;letter-spacing:4px;color:var(--gold-light);margin:24px 0;background:var(--surface);padding:14px;border-radius:var(--radius-sm);border:1px solid var(--gold-border);">'+esc(code)+'</div>'+
      '<p class="muted">Share this code with the venue manager. For security, only the cryptographic hash is stored.</p>'+
      '<div class="formActions" style="justify-content:center;margin-top:24px;">'+
        '<button class="btn-primary" type="button" onclick="codes()">Done</button>'+
        '<button class="btn-secondary" type="button" onclick="makeCode()">Generate Another</button>'+
      '</div>'+
    '</div>';
}

async function revoke(id){
  const r=await s.from('activation_codes').update({revoked_at:new Date().toISOString()}).eq('id',id);
  if(r.error)alert(r.error.message);
  else codes();
}

async function saveNewsForm(event,id){
  event.preventDefault();
  const fd=new FormData(event.currentTarget),title=String(fd.get('title')||'').trim(),slug=String(fd.get('slug')||'').trim();
  if(!title||!slug)return alert('Title and slug are required.');
  const publish=fd.get('is_published')==='on';
  const p={title,slug,summary:String(fd.get('summary')||'').trim()||null,body:String(fd.get('body')||'').trim()||null,cover_url:String(fd.get('cover_url')||'').trim()||null,is_published:publish,published_at:publish?new Date().toISOString():null};
  const r=id?await s.from('news').update(p).eq('id',id):await s.from('news').insert(p);
  if(r.error)alert(r.error.message);else news();
}

async function pubNews(id,v){
  const r=await s.from('news').update({is_published:v,published_at:v?new Date().toISOString():null}).eq('id',id);
  if(r.error)alert(r.error.message);else news();
}

async function delNews(id){
  if(!confirm('Delete this article?'))return;
  const r=await s.from('news').delete().eq('id',id);
  if(r.error)alert(r.error.message);else news();
}

async function verifyPinValue(pin){
  const value=String(pin||'').trim();
  if(!value)throw new Error('PIN cannot be empty.');
  const r=await s.rpc('verify_admin_security_pin',{p_pin:value});
  if(r.error)throw r.error;
  if(r.data!==true)throw new Error('Incorrect PIN or the PIN is temporarily locked.');
  return true;
}

async function saveSecurityPin(event){
  event.preventDefault();
  const form=event.currentTarget,fd=new FormData(form),pin=String(fd.get('pin')||''),confirmPin=String(fd.get('confirm')||'');
  if(!pin.trim())return securityMessage('PIN cannot be empty.');
  if(pin!==confirmPin)return securityMessage('PIN confirmation does not match.');
  const button=form.querySelector('button[type="submit"]');
  if(button){button.disabled=true;button.textContent='Saving…';}
  try{
    const r=await s.rpc('set_admin_security_pin',{p_pin:pin});
    if(r.error)throw r.error;
    form.reset();
    securityMessage('Admin Security PIN updated successfully.',true);
  }catch(e){
    securityMessage(e.message||'Could not save the PIN.');
  }finally{
    if(button){button.disabled=false;button.textContent='Update Security PIN';}
  }
}

async function savePasswordForm(event){
  event.preventDefault();
  const form=event.currentTarget,fd=new FormData(form),pin=String(fd.get('pin')||''),password=String(fd.get('password')||''),confirmPassword=String(fd.get('confirm')||'');
  if(!pin.trim())return securityMessage('PIN cannot be empty.');
  if(!password)return securityMessage('Password cannot be empty.');
  if(password!==confirmPassword)return securityMessage('New password confirmation does not match.');
  const button=form.querySelector('button[type="submit"]');
  if(button){button.disabled=true;button.textContent='Saving…';}
  try{
    await verifyPinValue(pin);
    const r=await s.auth.updateUser({password});
    if(r.error)throw r.error;
    form.reset();
    securityMessage('Password updated successfully.',true);
  }catch(e){
    securityMessage(e.message||'Could not update password.');
  }finally{
    if(button){button.disabled=false;button.textContent='Update Password';}
  }
}

async function saveEmailForm(event){
  event.preventDefault();
  const form=event.currentTarget,fd=new FormData(form),pin=String(fd.get('pin')||''),email=String(fd.get('email')||'').trim();
  if(!/^\S+@\S+\.\S+$/.test(email))return securityMessage('Enter a valid email address.');
  const button=form.querySelector('button[type="submit"]');
  if(button){button.disabled=true;button.textContent='Saving…';}
  try{
    await verifyPinValue(pin);
    const r=await s.auth.updateUser({email});
    if(r.error)throw r.error;
    form.reset();
    securityMessage('Email change submitted successfully. Check your email for confirmation.',true);
  }catch(e){
    securityMessage(e.message||'Could not update email.');
  }finally{
    if(button){button.disabled=false;button.textContent='Update Email';}
  }
}

async function saveHeroHeader(event, id){
  event.preventDefault();
  const form=event.currentTarget, fd=new FormData(form);
  const title=String(fd.get('title')||'').trim();
  const imageUrl=String(fd.get('image_url')||'').trim();
  if(!title)return alert('Main headline is required.');
  if(!imageUrl)return alert('Header photo is required.');
  const button=form.querySelector('button[type="submit"]');
  if(button){button.disabled=true; button.textContent='Saving…';}
  const payload={
    placement:'app_hero',
    title:title,
    body:String(fd.get('body')||'').trim()||null,
    cta_label:String(fd.get('cta_label')||'').trim()||null,
    cta_url:String(fd.get('cta_url')||'').trim()||null,
    image_url:imageUrl,
    is_enabled:fd.get('is_enabled')==='on',
    sort_order:0
  };
  try{
    const r=id
      ? await s.from('site_modules').update(payload).eq('id',id).select().single()
      : await s.from('site_modules').insert(payload).select().single();
    if(r.error)throw r.error;
    alert('Mobile header banner saved! The app will reflect changes immediately.');
    await heroHeader();
  }catch(e){
    alert(e.message||'Could not save header banner.');
  }finally{
    if(button){button.disabled=false; button.textContent='Save Header Banner';}
  }
}

// ---------------- IMAGE UPLOAD HELPER ----------------
function readImageBlob(file, maxDim=1800, quality=0.86){
  return new Promise((resolve, reject)=>{
    if(!file||!file.type.startsWith('image/')) return reject(new Error('Please select an image file.'));
    if(file.size>25*1024*1024) return reject(new Error('Please choose an image smaller than 25 MB.'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Failed to read image file.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('This image could not be decoded.'));
      img.onload=()=>{
        try{
          let w=img.width, h=img.height;
          if(w>maxDim||h>maxDim){
            if(w>h){h=Math.round(h*(maxDim/w)); w=maxDim;}
            else{w=Math.round(w*(maxDim/h)); h=maxDim;}
          }
          const canvas=document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          const ctx=canvas.getContext('2d');
          if(!ctx) return reject(new Error('Your browser cannot process this image.'));
          ctx.drawImage(img,0,0,w,h);
          canvas.toBlob(blob=>{
            if(!blob) return reject(new Error('Could not prepare this image for upload.'));
            resolve(blob);
          },'image/jpeg',quality);
        }catch(err){reject(err);}
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadSiteMedia(file, folder='site'){
  const blob=await readImageBlob(file);
  const sess=await s.auth.getSession();
  const token=sess?.data?.session?.access_token;
  if(!token) throw new Error('Your admin session has expired. Please sign in again.');
  const safeFolder=String(folder||'site').replace(/[^a-zA-Z0-9_-]/g,'-');
  const unique=(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
  const path=safeFolder+'/'+unique+'.jpg';
  const res=await fetch(U+'/storage/v1/object/site-media/'+path,{
    method:'POST',
    headers:{
      apikey:K,
      Authorization:'Bearer '+token,
      'Content-Type':'image/jpeg',
      'x-upsert':'false'
    },
    body:blob
  });
  const text=await res.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch{}
  if(!res.ok){
    const msg=data?.message||data?.error||text||('Upload failed (HTTP '+res.status+')');
    throw new Error(msg);
  }
  return U+'/storage/v1/object/public/site-media/'+path;
}

async function handleDeviceFile(fileInput, targetInputSelector, previewImgSelector, folder='site'){
  const file=fileInput.files&&fileInput.files[0];
  if(!file)return;
  const label=fileInput.parentElement;
  const oldText=label?.querySelector('span')?.textContent;
  try{
    if(label)label.style.opacity='0.6';
    if(label?.querySelector('span'))label.querySelector('span').textContent='Uploading…';
    const publicUrl=await uploadSiteMedia(file,folder);
    const targetInput=document.querySelector(targetInputSelector);
    if(targetInput){
      targetInput.value=publicUrl;
      targetInput.dispatchEvent(new Event('input'));
    }
    const preview=document.querySelector(previewImgSelector);
    if(preview){
      preview.src=publicUrl;
      preview.style.display='block';
    }
  }catch(err){
    alert(err.message||'Could not upload image from device.');
  }finally{
    if(label)label.style.opacity='1';
    if(label?.querySelector('span'))label.querySelector('span').textContent=oldText||'Choose photo from device';
    fileInput.value='';
  }
}
