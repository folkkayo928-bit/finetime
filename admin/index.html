async function saveBusinessForm(event,id){
 event.preventDefault();
 const form=event.currentTarget,fd=new FormData(form),lines=n=>String(fd.get(n)||'').split(/\\n|,/).map(x=>x.trim()).filter(Boolean);
 let opening={};
 try{opening=JSON.parse(String(fd.get('opening_hours')||'{}'))}catch(e){return alert('Opening hours must be valid JSON.')}
 const businessPayload={
   name:String(fd.get('name')||'').trim(),category:String(fd.get('category')||'restaurant'),
   city_id:String(fd.get('city_id')||'')||null,about:String(fd.get('about')||'').trim()||null,
   is_published:fd.get('is_published')==='on',phone:String(fd.get('phone')||'').trim()||null,
   lat:fd.get('lat')===''?null:Number(fd.get('lat')),lng:fd.get('lng')===''?null:Number(fd.get('lng')),
   opening_hours:opening,cover_url:String(fd.get('cover_url')||'').trim()||null,
   gallery_urls:lines('gallery_urls'),services:lines('services'),highlights:lines('highlights'),amenities:lines('amenities')
 };
 if(!businessPayload.name)return alert('Business name is required.');
 try{
   let businessId=id;
   if(id){
     const r=await s.from('businesses').update(businessPayload).eq('id',id);
     if(r.error)throw r.error;
   }else{
     const r=await s.from('businesses').insert(businessPayload).select('id').single();
     if(r.error)throw r.error;
     businessId=r.data.id;
   }
   const profilePayload={business_id:businessId,menu_slug:String(fd.get('menu_slug')||'').trim()||null,tagline:String(fd.get('tagline')||'').trim()||null,currency:String(fd.get('currency')||'ETB'),address:String(fd.get('address')||'').trim()||null,logo_url:String(fd.get('logo_url')||'').trim()||null,owner_name:String(fd.get('owner_name')||'').trim()||null,owner_email:String(fd.get('owner_email')||'').trim()||null,onboarding_status:String(fd.get('onboarding_status')||'pending'),payment_status:String(fd.get('payment_status')||'trial')};
   const pr=await s.from('business_admin_profiles').upsert(profilePayload,{onConflict:'business_id'});
   if(pr.error)throw pr.error;
   const subPayload={business_id:businessId,plan:String(fd.get('plan')||'basic'),status:String(fd.get('subscription_status')||'active'),monthly_price:fd.get('monthly_price')===''?null:Number(fd.get('monthly_price')),starts_on:String(fd.get('starts_on')||'')||null,ends_on:String(fd.get('ends_on')||'')||null,notes:String(fd.get('subscription_notes')||'').trim()||null};
   const sr=await s.from('business_subscriptions').upsert(subPayload,{onConflict:'business_id'});
   if(sr.error)throw sr.error;
   alert(id?'Business updated.':'Business created.');
   businesses();
 }catch(e){alert(e.message||'Could not save business.')}
}
async function delBusiness(id,button){
 if(!confirm('Delete this business? This removes the business record and may be blocked by related data.'))return;
 if(button)button.disabled=true;
 try{
   const r=await s.from('businesses').delete().eq('id',id).select('id').maybeSingle();
   if(r.error)throw r.error;
   if(!r.data){businessStatus('No business record was deleted. Related records may be preventing deletion, or the record is already gone.');return}
   await businesses();
   businessStatus('Business deleted successfully.',true);
 }catch(e){businessStatus(e.message||'The delete action failed.')}
 finally{if(button)button.disabled=false}
}

async function generateCode(event){
 event.preventDefault();
 const fd=new FormData(event.currentTarget),businessId=String(fd.get('business_id')||''),hours=Math.max(1,Math.min(8760,Number(fd.get('hours')||168)));
 const raw=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[x%36]).join('');
 const code='FT-'+raw.slice(0,6)+'-'+raw.slice(6);
 const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));
 const hash=Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
 const saveResult=await s.from('activation_codes').insert({business_id:businessId,code_hash:hash,expires_at:new Date(Date.now()+hours*3600000).toISOString()});
 if(saveResult.error)return alert(saveResult.error.message);
 const businessName=event.currentTarget.querySelector('select option:checked')?.textContent||'Selected business';
 view.innerHTML='<div class="card"><h2>Activation code created</h2><p class="muted">'+esc(businessName)+' · expires in '+hours+' hours</p><div style="font-size:28px;font-weight:900;letter-spacing:2px;margin:20px 0">'+esc(code)+'</div><p class="muted">Only the hash is stored in Supabase. Give this code to the partner now.</p><div class="formActions"><button type="button" onclick="codes()">Done</button><button type="button" class="g" onclick="makeCode()">Generate another</button></div></div>';
}
