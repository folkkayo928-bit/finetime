<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FineTime Admin</title><script>
(function(){
  const STORAGE_KEY='finetime_admin_session_v1';
  function read(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}}
  function write(v){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(v))}catch{}}
  async function json(res){
    const text=await res.text(); let data=null;
    try{data=text?JSON.parse(text):null}catch{}
    if(!res.ok){
      const msg=data?.msg||data?.message||data?.error_description||data?.error||text||('HTTP '+res.status);
      const e=new Error(msg); e.status=res.status; e.data=data; throw e;
    }
    return data;
  }
  async function refresh(session){
    if(!session?.refresh_token) return null;
    const res=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{apikey:K,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:session.refresh_token})
    });
    const data=await json(res);
    const next={access_token:data.access_token,refresh_token:data.refresh_token||session.refresh_token,expires_at:Date.now()+Number(data.expires_in||3600)*1000,user:data.user||session.user};
    write(next); return next;
  }
  async function session(){
    let v=read();
    if(!v?.access_token) return null;
    if(v.expires_at && v.expires_at<Date.now()+30000){
      try{v=await refresh(v)}catch{localStorage.removeItem(STORAGE_KEY);return null}
    }
    return v;
  }
  async function authFetch(path,opts={}){
    const sess=await session();
    const headers=Object.assign({apikey:K,'Content-Type':'application/json'},opts.headers||{});
    if(sess?.access_token) headers.Authorization='Bearer '+sess.access_token;
    const res=await fetch(U+path,Object.assign({},opts,{headers}));
    return json(res);
  }
  class Query{
    constructor(table){this.table=table;this.method='GET';this.selectValue='*';this.filters=[];this.orders=[];this.limitValue=null;this.body=null;this.expect='many';this.executed=false}
    select(value='*'){this.selectValue=value;this.wantReturn=true;return this}
    eq(k,v){this.filters.push([k,'eq',v]);return this}
    is(k,v){this.filters.push([k,'is',v]);return this}
    order(k,o={}){this.orders.push([k,o]);return this}
    limit(n){this.limitValue=n;return this}
    maybeSingle(){this.expect='maybe';return this}
    single(){this.expect='single';return this}
    insert(body){this.method='POST';this.body=body;return this}
    update(body){this.method='PATCH';this.body=body;return this}
    delete(){this.method='DELETE';return this}
    async execute(){
      if(this.executed)return this.result;
      this.executed=true;
      const qs=new URLSearchParams();
      if(this.method==='GET'||this.wantReturn) qs.set('select',this.selectValue);
      for(const [k,op,v] of this.filters){
        qs.set(k,op+'.'+(v===null?'null':String(v)));
      }
      for(const [k,o] of this.orders) qs.append('order',k+'.'+(o.ascending?'asc':'desc'));
      if(this.limitValue!=null)qs.set('limit',String(this.limitValue));
      const sess=await session();
      if(!sess?.access_token) throw new Error('Your admin session has expired. Please sign in again.');
      const headers={apikey:K,Authorization:'Bearer '+sess.access_token};
      if(this.method!=='GET')headers['Content-Type']='application/json';
      if(this.method!=='GET'&&this.wantReturn)headers.Prefer='return=representation';
      const url=U+'/rest/v1/'+encodeURIComponent(this.table)+(qs.toString()?'?'+qs.toString():'');
      const res=await fetch(url,{method:this.method,headers,body:this.method==='GET'||this.method==='DELETE'?undefined:JSON.stringify(this.body)});
      const data=await json(res);
      let out=data;
      if(this.expect==='single'){
        if(!Array.isArray(data)||data.length!==1)throw new Error('Expected one '+this.table+' record.');
        out=data[0];
      }else if(this.expect==='maybe'){
        if(!Array.isArray(data))out=data;
        else if(data.length>1)throw new Error('Expected at most one '+this.table+' record.');
        else out=data[0]||null;
      }
      this.result={data:out,error:null}; return this.result;
    }
    then(resolve,reject){return this.execute().then(resolve,reject)}
  }
  function createClient(url,key){
    return {
      auth:{
        async signInWithPassword({email,password}){
          try{
            const res=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
            const data=await json(res);
            const sess={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+Number(data.expires_in||3600)*1000,user:data.user};
            write(sess); return {data:{session:sess,user:data.user},error:null};
          }catch(error){return {data:{session:null,user:null},error}}
        },
        async getSession(){try{return {data:{session:await session()},error:null}}catch(error){return {data:{session:null},error}}},
        async signOut(){localStorage.removeItem(STORAGE_KEY);return {error:null}},
        async resetPasswordForEmail(email,{redirectTo}={}){try{const res=await fetch(U+'/auth/v1/recover',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:redirectTo||location.href.split('#')[0]})});return {data:null,error:res.ok?null:await json(res)}}catch(error){return {data:null,error}}},
        async updateUser(attributes){try{const sess=await session();if(!sess?.access_token)throw new Error('Your admin session has expired.');const res=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify(attributes)});const data=await json(res);return {data:{user:data},error:null}}catch(error){return {data:null,error}}},
        async recoverFromHash(){const p=new URLSearchParams((location.hash||'').replace(/^#/,'').replace(/^\?/,'') );const access=p.get('access_token'),refreshToken=p.get('refresh_token');if(!access||!refreshToken)return null;const expires=Number(p.get('expires_in')||3600);const res=await fetch(U+'/auth/v1/user',{headers:{apikey:K,Authorization:'Bearer '+access}});const user=await json(res);const sess={access_token:access,refresh_token:refreshToken,expires_at:Date.now()+expires*1000,user};write(sess);history.replaceState(null,'',location.pathname+location.search);return sess}
      },
      from(table){return new Query(table)},
      async rpc(name,args={}){try{const sess=await session();if(!sess?.access_token)throw new Error('Your admin session has expired.');const res=await fetch(U+'/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',headers:{apikey:K,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify(args)});const data=await json(res);return {data,error:null}}catch(error){return {data:null,error}}}
    };
  }
  globalThis.supabase={createClient};
})();
</script><style>body{margin:0;background:#111;color:#f5f1e8;font:15px system-ui}main{max-width:1050px;margin:auto;padding:20px}.brand{color:#c9a227;font-weight:900;letter-spacing:4px;font-size:24px}.card{background:#1b1b1b;border:1px solid #fff1;border-radius:14px;padding:15px;margin:12px 0}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}button,input{font:inherit;border-radius:9px;padding:9px 11px}button{border:0;background:#c9a227;color:#111;font-weight:800}button.d{background:#8b3525;color:white}button.g{background:transparent;color:#f5f1e8;border:1px solid #fff3}.muted{color:#aaa}.pill{float:right;background:#fff1;padding:4px 7px;border-radius:999px;font-size:12px}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:8px}.item{border-top:1px solid #fff1;padding:12px 0}.error{color:#ffb4a8}</style></head><body><main><div class="brand">FINETIME ADMIN</div><p id="status" class="muted">Admin console ready — sign in below.</p><p class="muted">Console version: 2026-09-30e. Uses browser-native Supabase REST/Auth; no third-party SDK is required.</p><section id="login" class="card"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Email"><br><br><input id="pass" type="password" placeholder="Password"><br><br><button onclick="login()">Sign in</button> <button class="g" onclick="forgotPassword()">Forgot password?</button><p id="err" class="error"></p></section><section id="app" class="hidden"><div class="nav"><button onclick="businesses()">Businesses</button><button onclick="codes()">Activation Codes</button><button onclick="news()">News</button><button onclick="modules()">Site Modules</button><button onclick="audit()">Audit</button><button onclick="security()">Security</button><button class="g" onclick="logout()">Sign out</button></div><div id="view"></div></section></main><script>
const U='__SUPABASE_URL__',K='__SUPABASE_ANON_KEY__',s=supabase.createClient(U,K),view=document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const csv=x=>String(x||'').split(',').map(v=>v.trim()).filter(Boolean);
async function login(){const emailEl=document.getElementById('email'),passEl=document.getElementById('pass'),errEl=document.getElementById('err'),statusEl=document.getElementById('status'),button=document.querySelector('#login button');errEl.textContent='';const emailValue=emailEl.value.trim(),passwordValue=passEl.value;if(!emailValue||!passwordValue){errEl.textContent='Enter both your email and password.';return}if(button){button.disabled=true;button.textContent='Signing in…'}statusEl.textContent='Signing in…';try{const r=await withTimeout(s.auth.signInWithPassword({email:emailValue,password:passwordValue}),'Sign-in request');if(r.error){errEl.textContent=r.error.message;statusEl.textContent='Sign-in failed.';return}statusEl.textContent='Signed in. Checking admin access…';await boot()}catch(e){errEl.textContent=e.message||'Sign-in failed. Please try again.';statusEl.textContent='Sign-in failed.'}finally{if(button){button.disabled=false;button.textContent='Sign in'}}}
async function logout(){await s.auth.signOut();location.reload()}
async function forgotPassword(){const email=document.getElementById('email').value.trim();if(!email)return alert('Enter your admin email first.');const r=await s.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(r.error)alert(r.error.message);else alert('If that email belongs to an account, a password reset email has been sent. Follow the link to return here and complete the reset with your Admin Security PIN.')}
async function verifyPin(){const pin=prompt('Enter your 6–12 digit Admin Security PIN:');if(pin===null)return false;if(!/^\\d{6,12}$/.test(pin))return alert('PIN must contain 6 to 12 digits.'),false;const r=await s.rpc('verify_admin_security_pin',{p_pin:pin});if(r.error)throw r.error;if(r.data!==true)return alert('Incorrect PIN or temporarily locked after repeated failures.'),false;return true}
async function setPin(){const a=prompt('Create a 6–12 digit numeric Admin Security PIN:');if(a===null)return;if(!/^\\d{6,12}$/.test(a))return alert('PIN must contain 6 to 12 digits.');const b=prompt('Confirm your Admin Security PIN:');if(b!==a)return alert('PINs do not match.');const r=await s.rpc('set_admin_security_pin',{p_pin:a});if(r.error)alert(r.error.message);else alert('Admin Security PIN saved. Keep it private.');security()}
async function changePassword(){if(!(await verifyPin()))return;const p=prompt('New password (use a strong, unique password):');if(p===null)return;if(p.length<8)return alert('Use at least 8 characters.');const r=await s.auth.updateUser({password:p});if(r.error)alert(r.error.message);else alert('Password updated successfully.')}
async function changeEmail(){if(!(await verifyPin()))return;const email=prompt('New admin email address:');if(email===null)return;if(!/^\\S+@\\S+\\.\\S+$/.test(email.trim()))return alert('Enter a valid email address.');const r=await s.auth.updateUser({email:email.trim()});if(r.error)alert(r.error.message);else alert('Email change requested. Supabase may require confirmation of the current and new email addresses.')}
async function security(){const {data:{session}}=await s.auth.getSession();if(!session?.user)return;view.innerHTML='<div class="card"><h2>Admin Security</h2><p class="muted">This extra PIN protects password and email changes. The PIN is stored only as a server-side hash and is never saved in this page or GitHub.</p><button onclick="setPin()">Set / Change PIN</button><br><br><button onclick="changePassword()">Change password (PIN required)</button><br><br><button onclick="changeEmail()">Change email (PIN required)</button><br><br><button class="g" onclick="businesses()">Back to Businesses</button></div>';if((location.hash||'').includes('access_token=')){alert('Password recovery session received. Use Security → Change password and enter your Admin Security PIN.')}}

async function withTimeout(p,label='Request'){return await Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+' timed out. Check your connection and try again.')),10000))])}
async function boot(){const loginEl=document.getElementById('login'),appEl=document.getElementById('app'),statusEl=document.getElementById('status'),errEl=document.getElementById('err');try{statusEl.textContent='Checking session…';const {data:{session},error:sessionError}=await withTimeout(s.auth.getSession(),'Session check');if(sessionError)throw sessionError;const user=session?.user;if(!user){loginEl.classList.remove('hidden');appEl.classList.add('hidden');statusEl.textContent='Please sign in.';return}const r=await withTimeout(s.from('admin_memberships').select('role').eq('user_id',user.id).maybeSingle(),'Admin access check');if(r.error)throw r.error;if(r.data?.role!=='admin'){await s.auth.signOut();loginEl.classList.remove('hidden');appEl.classList.add('hidden');statusEl.textContent='Signed in, but this account is not a FineTime admin.';errEl.textContent='No admin membership is currently assigned to this account.';return}loginEl.classList.add('hidden');appEl.classList.remove('hidden');statusEl.textContent='Admin session active.';errEl.textContent='';await businesses()}catch(e){loginEl.classList.remove('hidden');appEl.classList.add('hidden');statusEl.textContent='Admin sign-in check failed.';errEl.textContent=e.message||'The admin request failed. Please try again.'}}
const q=x=>encodeURIComponent(JSON.stringify(x)),dq=x=>{try{return JSON.parse(decodeURIComponent(x))}catch{return{}}};
async function businesses(){const r=await s.from('businesses').select('*').order('name');if(r.error)return view.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';view.innerHTML='<div class="row"><h2>Businesses</h2><button onclick="businessForm()">+ Create</button></div>'+(r.data||[]).map(b=>'<div class="card"><b>'+esc(b.name)+'</b><span class="pill">'+esc(b.category)+' · '+(b.is_published?'Published':'Hidden')+'</span><p class="muted">'+esc(b.about||'')+'</p><button onclick="businessForm(\''+q(b)+'\')">Edit</button> <button onclick="publish(\''+b.id+'\','+(!b.is_published)+')">'+(b.is_published?'Hide':'Publish')+'</button> <button class="d" onclick="delBusiness(\''+b.id+'\')">Delete</button></div>').join('')||'<div class="card muted">No businesses.</div>'}
function businessForm(x){const b=x?dq(x):{};const name=prompt('Business name',b.name||'');if(name===null)return;const cat=prompt('Category: hotel / restaurant / cafe',b.category||'restaurant');if(cat===null)return;const about=prompt('About',b.about||'');if(about===null)return;const phone=prompt('Phone',b.phone||'');if(phone===null)return;const cover=prompt('Cover image URL',b.cover_url||'');if(cover===null)return;saveBusiness(b,{name:name.trim(),category:cat.trim(),about:about.trim()||null,phone:phone.trim()||null,cover_url:cover.trim()||null})}
async function saveBusiness(b,p){const r=b.id?await s.from('businesses').update(p).eq('id',b.id):await s.from('businesses').insert(p);if(r.error)alert(r.error.message);else businesses()}
async function publish(id,v){const r=await s.from('businesses').update({is_published:v}).eq('id',id);if(r.error)alert(r.error.message);else businesses()}
async function delBusiness(id){if(!confirm('Delete this business?'))return;const r=await s.from('businesses').delete().eq('id',id);if(r.error)alert(r.error.message);else businesses()}
async function codes(){const r=await s.from('activation_codes').select('id,business_id,expires_at,used_at,revoked_at,created_at,businesses(name)').order('created_at',{ascending:false});if(r.error)return view.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';view.innerHTML='<h2>Activation Codes</h2><button onclick="makeCode()">+ Generate</button>'+(r.data||[]).map(x=>'<div class="card"><b>'+esc(x.businesses?.name||x.business_id)+'</b><span class="pill">'+(x.used_at?'Used':x.revoked_at?'Revoked':x.expires_at&&new Date(x.expires_at)<new Date()?'Expired':'Active')+'</span><p class="muted">'+esc(x.created_at)+'</p>'+(!x.used_at&&!x.revoked_at?'<button class="d" onclick="revoke(\''+x.id+'\')">Revoke</button>':'')+'</div>').join('')}
async function makeCode(){const r=await s.from('businesses').select('id,name').order('name');if(r.error||!r.data?.length)return alert('Create a business first.');const pick=prompt('Choose business number:\n'+r.data.map((b,i)=>(i+1)+'. '+b.name).join('\n'),'1');const index=Number(pick)-1;if(!Number.isInteger(index)||!r.data[index])return;const b=r.data[index].id;const h=Number(prompt('Expires in hours','168'));const raw=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[x%36]).join(''),code='FT-'+raw.slice(0,6)+'-'+raw.slice(6);const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code)),hash=Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');const saveResult=await s.from('activation_codes').insert({business_id:b,code_hash:hash,expires_at:new Date(Date.now()+Math.max(1,h||168)*3600000).toISOString()});if(saveResult.error)alert(saveResult.error.message);else{alert('Activation code: '+code+'\nGive it to the partner now. Only the hash is stored.');codes()}}
async function revoke(id){const r=await s.from('activation_codes').update({revoked_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else codes()}
async function news(){const r=await s.from('news').select('*').order('created_at',{ascending:false});if(r.error)return view.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';view.innerHTML='<h2>News</h2><button onclick="makeNews()">+ Create</button>'+(r.data||[]).map(n=>'<div class="card"><b>'+esc(n.title)+'</b><span class="pill">'+(n.is_published?'Published':'Draft')+'</span><p class="muted">'+esc(n.summary||'')+'</p><button onclick="editNews(\''+q(n)+'\')">Edit</button> <button onclick="pubNews(\''+n.id+'\','+(!n.is_published)+')">'+(n.is_published?'Hide':'Publish')+'</button> <button class="d" onclick="delNews(\''+n.id+'\')">Delete</button></div>').join('')}
function makeNews(){editNews(q({}))}
async function editNews(x){const n=dq(x);const title=prompt('Title',n.title||'');if(title===null)return;const slug=prompt('Slug',n.slug||title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));if(slug===null)return;const summary=prompt('Summary',n.summary||'');if(summary===null)return;const body=prompt('Body',n.body||'');if(body===null)return;const cover=prompt('Cover URL',n.cover_url||'');if(cover===null)return;const p={title:title.trim(),slug:slug.trim(),summary:summary.trim()||null,body:body.trim()||null,cover_url:cover.trim()||null};const r=n.id?await s.from('news').update(p).eq('id',n.id):await s.from('news').insert(p);if(r.error)alert(r.error.message);else news()}
async function pubNews(id,v){const r=await s.from('news').update({is_published:v,published_at:v?new Date().toISOString():null}).eq('id',id);if(r.error)alert(r.error.message);else news()}
async function delNews(id){if(!confirm('Delete this news?'))return;const r=await s.from('news').delete().eq('id',id);if(r.error)alert(r.error.message);else news()}
async function modules(){const r=await s.from('site_modules').select('*').order('placement').order('sort_order');if(r.error)return view.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';view.innerHTML='<h2>Site Modules</h2><button onclick="editModule()">+ Create</button>'+(r.data||[]).map(m=>'<div class="card"><b>'+esc(m.title)+'</b><span class="pill">'+esc(m.placement)+' · '+(m.is_enabled?'Enabled':'Disabled')+'</span><p class="muted">'+esc(m.body||'')+'</p><button onclick="editModule(\''+q(m)+'\')">Edit</button> <button onclick="toggleModule(\''+m.id+'\','+(!m.is_enabled)+')">'+(m.is_enabled?'Disable':'Enable')+'</button> <button class="d" onclick="delModule(\''+m.id+'\')">Delete</button></div>').join('')}
function editModule(x){const m=x?dq(x):{};const placement=prompt('Placement',m.placement||'app_home');if(placement===null)return;const title=prompt('Title',m.title||'');if(title===null)return;const body=prompt('Body',m.body||'');if(body===null)return;const cta=prompt('CTA label',m.cta_label||'');if(cta===null)return;const url=prompt('CTA URL',m.cta_url||'');if(url===null)return;const image=prompt('Image URL',m.image_url||'');if(image===null)return;saveModule(m,{placement,title,body:body||null,cta_label:cta||null,cta_url:url||null,image_url:image||null,sort_order:Number(prompt('Sort order',m.sort_order||0)||0)})}
async function saveModule(m,p){const r=m.id?await s.from('site_modules').update(p).eq('id',m.id):await s.from('site_modules').insert(p);if(r.error)alert(r.error.message);else modules()}
async function toggleModule(id,v){const r=await s.from('site_modules').update({is_enabled:v}).eq('id',id);if(r.error)alert(r.error.message);else modules()}
async function delModule(id){if(!confirm('Delete this module?'))return;const r=await s.from('site_modules').delete().eq('id',id);if(r.error)alert(r.error.message);else modules()}
async function audit(){const r=await s.from('admin_audit_logs').select('*').order('created_at',{ascending:false}).limit(200);if(r.error)return view.innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';view.innerHTML='<h2>Audit Log</h2>'+(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.action)+'</b><span class="pill">'+esc(x.entity_type)+'</span><div class="muted">'+esc(x.created_at)+' · '+esc(x.entity_id||'')+'</div></div>').join('')||'<div class="card muted">No audit entries.</div>'}
(async()=>{try{await s.auth.recoverFromHash()}catch(e){console.warn('Recovery session could not be restored',e)}boot()})();
</script></body></html>
