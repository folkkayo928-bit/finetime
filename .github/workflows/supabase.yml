name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: finetime-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FINETIME_TELEGRAM_BOT_TOKEN: ${{ secrets.FINETIME_TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment credentials
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase deployment secrets are not configured; live Supabase is already managed separately."
          fi
      - name: Link project
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Check migration state
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list
      - name: Apply pending database migrations
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          supabase migration list > /tmp/finetime-migrations.txt
          cat /tmp/finetime-migrations.txt
          if awk -F'|' 'NR > 2 && $2 ~ /^[[:space:]]*$/ && $3 ~ /[0-9]/ {found=1} END {exit !found}' /tmp/finetime-migrations.txt; then
            echo "::warning::Remote Supabase migrations are present that are not in this repository; leaving live database state untouched and skipping automatic db push."
          else
            supabase db push --include-all
          fi
      - name: Verify Telegram bot credentials
        if: env.FINETIME_TELEGRAM_BOT_TOKEN != ''
        env:
          FINETIME_TELEGRAM_BOT_TOKEN: ${{ secrets.FINETIME_TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            "https://api.telegram.org/bot${FINETIME_TELEGRAM_BOT_TOKEN}/getMe" \
            | jq -e '.ok == true' >/dev/null
          echo "Telegram bot token verified."
      - name: Set Telegram bot secret
        if: steps.config.outputs.configured == 'true' && env.FINETIME_TELEGRAM_BOT_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set FINETIME_TELEGRAM_BOT_TOKEN="${{ secrets.FINETIME_TELEGRAM_BOT_TOKEN }}"
      - name: Deploy Edge Functions
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy
      - name: Configure Telegram partner webhook
        if: steps.config.outputs.configured == 'true' && env.FINETIME_TELEGRAM_BOT_TOKEN != ''
        env:
          FINETIME_TELEGRAM_BOT_TOKEN: ${{ secrets.FINETIME_TELEGRAM_BOT_TOKEN }}
        run: |
          WEBHOOK_SECRET="$(printf '%s' "$FINETIME_TELEGRAM_BOT_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${FINETIME_TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            --data "{\"url\":\"https://atewcbkuzrnfnmzsylze.supabase.co/functions/v1/telegram-bot\",\"allowed_updates\":[\"message\"],\"secret_token\":\"${WEBHOOK_SECRET}\",\"drop_pending_updates\":false}"
          curl --fail --silent --show-error \
            "https://api.telegram.org/bot${FINETIME_TELEGRAM_BOT_TOKEN}/getWebhookInfo" \
            | jq -e '.ok == true and .result.url == "https://atewcbkuzrnfnmzsylze.supabase.co/functions/v1/telegram-bot"' >/dev/null
          echo "Telegram webhook verified."
