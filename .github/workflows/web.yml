name: Deploy Flutter Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: finetime-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
          pub-cache: true
      - name: Generate missing Flutter web files
        run: flutter create . --platforms=web --org com.finetime --project-name finetime --no-pub
      - run: mkdir -p assets
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter --version
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Build Flutter web
        run: flutter build web --release --base-href /finetime/ --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
      - name: Mirror Flutter assets for custom-domain hosting
        run: |
          mkdir -p build/web/finetime
          find build/web -mindepth 1 -maxdepth 1 ! -name finetime -exec cp -a {} build/web/finetime/ \;
      - name: Add Partner Mini App
        run: |
          mkdir -p build/web/partner
          cp partner/index.html build/web/partner/index.html
          cp partner/index.html build/web/partner.html
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            sed -i 's|https://atewcbkuzrnfnmzsylze.supabase.co|${{ secrets.SUPABASE_URL }}|g' build/web/partner/index.html build/web/partner.html
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            sed -i 's|sb_publishable_CxfreIiozKEB-GcvNOCyhQ_RVnIgGVG|${{ secrets.SUPABASE_ANON_KEY }}|g' build/web/partner/index.html build/web/partner.html
          fi
      - name: Add public website
        run: |
          mkdir -p build/web/website
          cp website/index.html website/business.html website/menu.html website/news.html website/robots.txt website/sitemap.xml build/web/website/
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            sed -i 's|https://atewcbkuzrnfnmzsylze.supabase.co|${{ secrets.SUPABASE_URL }}|g' build/web/website/*.html
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            sed -i 's|sb_publishable_CxfreIiozKEB-GcvNOCyhQ_RVnIgGVG|${{ secrets.SUPABASE_ANON_KEY }}|g' build/web/website/*.html
          fi
      - name: Add admin console
        run: |
          mkdir -p build/web/admin
          cp admin/index.html build/web/admin/index.html
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            sed -i 's|https://atewcbkuzrnfnmzsylze.supabase.co|${{ secrets.SUPABASE_URL }}|g' build/web/admin/index.html
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            sed -i 's|sb_publishable_CxfreIiozKEB-GcvNOCyhQ_RVnIgGVG|${{ secrets.SUPABASE_ANON_KEY }}|g' build/web/admin/index.html
          fi
      - name: Verify public deployment package
        run: python3 tools/verify_static_deploy.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
