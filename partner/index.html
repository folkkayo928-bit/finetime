<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FineTime Partner · build 20261001g</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<style>
:root{--charcoal:#121212;--panel:#1b1b1b;--panel2:#222;--gold:#c9a227;--ivory:#f5f1e8;--muted:#a0a0a0;--danger:#7b3020}
*{box-sizing:border-box}body{margin:0;background:var(--charcoal);color:var(--ivory);font:15px system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto;padding:18px 14px 44px}.brand{color:var(--gold);font-weight:900;letter-spacing:3px;font-size:22px}.sub{color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid #ffffff12;border-radius:16px;padding:16px;margin-top:14px}
input,textarea,select,button{font:inherit;border-radius:11px;padding:11px 12px}input,textarea,select{width:100%;border:0;background:#fff;color:#121212;margin-top:6px}textarea{min-height:80px;resize:vertical}
button{border:0;background:var(--gold);color:#121212;font-weight:800;cursor:pointer}.ghost{background:transparent;color:var(--ivory);border:1px solid #ffffff22}.danger{background:var(--danger);color:#fff}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.nav button{padding:10px 6px}.nav button.active{outline:2px solid var(--gold)}
.item{padding:14px 0;border-bottom:1px solid #ffffff10}.item:last-child{border-bottom:0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{font-size:11px;background:#ffffff10;padding:5px 8px;border-radius:999px}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.error{color:#ffb4a8;margin-top:10px}.ok{color:#9fd6a4;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{padding:8px 10px}.sectionTitle{margin:0 0 5px}.label{display:block;color:var(--muted);font-size:12px;margin-top:8px}
.inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.day{background:#ffffff08;border:1px solid #ffffff10;border-radius:12px;padding:10px}.day button{width:100%;padding:8px}.day label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:5px}.formHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.formSection{background:#151515;border:1px solid #ffffff12;border-radius:13px;padding:14px;margin:12px 0}.formSection h4{margin:0 0 10px;color:var(--gold)}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{color:#ddd;font-size:12px;font-weight:700}.help{color:var(--muted);font-size:11px}.formActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:7px}.check input{width:auto;margin:0}.preview{width:100%;max-height:190px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid #ffffff12}@media(max-width:620px){.grid,.grid3,.formGrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.inventory{grid-template-columns:1fr}}

</style>
</head>
<body>
<main>
<div class="brand">FINETIME</div><div class="sub">Unified Partner · Hotel · Restaurant · Café</div>

<section id="connect" class="card">
<h2>Connect your business</h2>
<p class="muted">Use the activation code supplied by FineTime Admin. Your Telegram identity is bound to the authorized business.</p>
<form id="connectForm" onsubmit="return activate(event)">
<input id="code" placeholder="Activation code" autocomplete="off">
<div class="actions"><button id="connectBusinessButton" type="submit">Connect Business</button></div>
</form>
<div id="connectError" class="error"></div>
</section>

<section id="app" class="hidden">
<div id="business" class="card"></div>
<div id="nav" class="nav"></div>
<div id="content" class="card"></div>
</section>
</main>

<script>
const SUPABASE_URL='__SUPABASE_URL__';
const SUPABASE_KEY='__SUPABASE_ANON_KEY__';
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();

let state={business:null,bookings:[],reservations:[],orders:[],rooms:[],inventory:[],categories:[],promotions:[],subscription:null};
let tab='overview';
let firstBootstrap=true;
let previousRequestKey='';
let pollTimer=null;

function initData(){return tg?.initData||''}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function attr(value){return esc(value)}
function editorOpen(){return !!document.querySelector('#content form')}
async function api(action,extra={}){
 const telegramInitData=initData();
 if(!telegramInitData) throw new Error('This Partner Mini App must be opened from Telegram. Open FineTime Partner from the Telegram bot, then enter your activation code.');
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),12000);
 let r;
 try{r=await fetch(SUPABASE_URL+'/functions/v1/partner-api',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action,initData:telegramInitData,...extra}),signal:controller.signal});}catch(e){if(e?.name==='AbortError')throw new Error('Partner service timed out. Check your connection and reopen the Mini App.');throw e}finally{clearTimeout(timeout)}
 const text=await r.text();
 let d;
 try{d=JSON.parse(text)}catch(_){throw new Error('Partner service returned an invalid response. Please reopen the Mini App and try again.')}
 if(!r.ok)throw new Error(d.error||'Request failed');
 return d;
}
async function uploadImageFile(file){
 if(!file)return null;
 if(!file.type.startsWith('image/'))throw new Error('Please choose an image file.');
 if(file.size>5*1024*1024)throw new Error('Image must be 5 MB or smaller.');
 const meta=await api('create_media_upload',{file_name:file.name,mime_type:file.type});
 const cleanPath=String(meta.path||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
 const signedUrl=SUPABASE_URL+'/storage/v1/object/upload/sign/business-media/'+cleanPath+'?token='+encodeURIComponent(meta.token);
 const form=new FormData();
 form.append('cacheControl','3600');
 form.append('',file,file.name);
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),20000);
 try{
  const response=await fetch(signedUrl,{method:'PUT',headers:{apikey:SUPABASE_KEY,'x-upsert':'false'},body:form,signal:controller.signal});
  const text=await response.text();
  let data=null;try{data=text?JSON.parse(text):null}catch{}
  if(!response.ok)throw new Error(data?.message||data?.error||text||('Image upload failed ('+response.status+').'));
 }catch(e){
  if(e?.name==='AbortError')throw new Error('Image upload timed out. Please try again.');
  throw e;
 }finally{clearTimeout(timeout)}
 return meta.public_url;
}
function pickImages(multiple=false){
 return new Promise((resolve,reject)=>{
  const input=document.createElement('input');
  input.type='file'; input.accept='image/jpeg,image/png,image/webp,image/gif'; input.multiple=multiple;
  input.onchange=async()=>{
   try{
    const files=Array.from(input.files||[]);
    if(!files.length){resolve([]);return}
    const urls=[];
    for(const file of files) urls.push(await uploadImageFile(file));
    resolve(urls);
   }catch(e){reject(e)}
  };
  input.click();
 });
}
async function uploadInto(fieldId,multiple=false){
 try{
  const urls=await pickImages(multiple);
  if(urls[0]){
   const el=document.getElementById(fieldId);
   el.value=multiple?[...(el.value?el.value.split(',').map(x=>x.trim()).filter(Boolean):[]),...urls].join(', '):urls[0];
   el.dispatchEvent(new Event('input',{bubbles:true}));
  }
 }catch(e){alert(e.message||'Could not upload image.')}
}
async function uploadCoverFromDevice(){
 try{
  const urls=await pickImages(false);
  if(urls[0])document.getElementById('bc').value=urls[0];
 }catch(e){alert(e.message||'Could not upload image.')}
}
async function uploadGalleryFromDevice(){
 try{
  const urls=await pickImages(true);
  if(urls.length){
   const current=document.getElementById('bg').value.split(',').map(x=>x.trim()).filter(Boolean);
   document.getElementById('bg').value=[...current,...urls].join(', ');
  }
 }catch(e){alert(e.message||'Could not upload images.')}
}
async function activate(event){
  event?.preventDefault();
 const error=document.getElementById('connectError');
 const button=document.getElementById('connectBusinessButton');
 const code=document.getElementById('code').value.trim();
 error.className='muted';
 error.textContent='Connecting…';
 if(button){button.disabled=true;button.textContent='Connecting…';}
 try{
  if(!code)throw new Error('Enter your activation code.');
  try{
   await api('activate',{code});
  }catch(e){
   if(!e?.message?.toLowerCase().includes('already connected'))throw e;
  }
  await bootstrap();
  error.textContent='';
 }catch(e){
  error.className='error';
  error.textContent=e.message||'Could not connect. Please try again.';
 }finally{
  if(button){button.disabled=false;button.textContent='Connect Business';}
 }
}
document.getElementById('connectBusinessButton')?.addEventListener('click',()=>activate());
window.activate=activate;

async function autoConnect(){
 try{
  document.getElementById('connectError').className='muted';
  document.getElementById('connectError').textContent=initData()?'Checking Telegram connection…':'Open this page from the FineTime Partner button inside Telegram.';
  if(!initData()) return;
  await bootstrap();
  document.getElementById('connectError').textContent='';
 }catch(e){
  document.getElementById('connectError').className='error';
  document.getElementById('connectError').textContent=e.message||'Please enter your activation code.';
 }
}
async function bootstrap(){
 try{
  const d=await api('bootstrap');
  const nextState={business:d.business||null,bookings:d.bookings||[],reservations:d.reservations||[],orders:d.orders||[],rooms:d.rooms||[],inventory:d.inventory||[],categories:d.categories||[],promotions:d.promotions||[],subscription:d.subscription||null};
  const requestKey=[...nextState.bookings.filter(x=>x.status==='requested').map(x=>'b:'+x.id),...nextState.reservations.filter(x=>x.status==='requested').map(x=>'r:'+x.id),...nextState.orders.filter(x=>x.status==='placed').map(x=>'o:'+x.id)].sort().join('|');
  if(!firstBootstrap && requestKey!==previousRequestKey) notifyNewRequest();
  previousRequestKey=requestKey;
  firstBootstrap=false;
  const keepEditor=editorOpen();
  state=nextState;
  document.getElementById('connect').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('business').innerHTML='<h2>'+esc(state.business?.name||'FineTime Partner')+'</h2><div class="muted">'+esc(state.business?.category||'')+' · '+(state.business?.is_published?'Published':'Not published')+'</div>';
  renderNav();
  if(!keepEditor) render();
  if(!pollTimer) pollTimer=setInterval(()=>bootstrap().catch(()=>{}),10000);
 }catch(e){
  const message=e?.message||'Partner connection failed.';
  document.getElementById('connectError').className='error';
  document.getElementById('connectError').textContent=message;
  throw e;
 }
}
function renderNav(){
 const category=String(state.business?.category||'').toLowerCase();
 const isHotel=category==='hotel';
 const hasFood=(state.categories||[]).length>0;
 const pending=(isHotel?state.bookings.filter(x=>x.status==='requested').length:state.reservations.filter(x=>x.status==='requested').length)+((!isHotel||hasFood)?state.orders.filter(x=>x.status==='placed').length:0);
 const tabs=[['overview','Overview']];
 if(isHotel) tabs.push(['bookings','Bookings'],['rooms','Rooms']);
 else tabs.push(['reservations','Reservations']);
 if(!isHotel||hasFood) tabs.push(['orders','Orders'],['menu','Menu']);
 tabs.push(['promotions','Promotions'],['settings','Business']);
 document.getElementById('nav').innerHTML=tabs.map(([id,label])=>'<button class="'+(tab===id?'active':'ghost')+'" data-tab="'+id+'">'+label+(id==='overview'&&pending?' <span class="pill">'+pending+' NEW</span>':'')+'</button>').join('');
 document.querySelectorAll('#nav [data-tab]').forEach(button=>button.onclick=()=>showTab(button.dataset.tab));
 const brandSub=document.querySelector('.sub');
 if(brandSub) brandSub.textContent=isHotel?'Hotel Partner · FineTime':'Restaurant & Café Partner · FineTime';
}
function showTab(t){tab=t;renderNav();render()}
function render(){const f={overview:renderOverview,bookings:()=>renderList('bookings'),reservations:()=>renderList('reservations'),orders:()=>renderList('orders'),menu:renderMenu,rooms:renderRooms,promotions:renderPromotions,settings:renderSettings};f[tab]()}
function renderOverview(){
 const b=state.business||{};const s=state.subscription;
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Partner overview</h3>'+
 '<div class="grid3"><div class="item"><strong>'+state.bookings.length+'</strong><div class="muted">Recent bookings</div></div><div class="item"><strong>'+state.reservations.length+'</strong><div class="muted">Reservations</div></div><div class="item"><strong>'+state.orders.length+'</strong><div class="muted">Orders</div></div></div>'+
 '<div class="item"><strong>Subscription</strong><div class="muted">'+esc(s?.plan||'Not configured')+' · '+esc(s?.status||'Contact FineTime')+'</div></div>'+
 '<div class="item"><strong>Public profile</strong><div class="muted">'+(b.is_published?'Published on FineTime':'Not published yet')+'</div></div>'+
 '<div class="actions"><button onclick="showTab(\'settings\')">Edit business</button><button class="ghost" onclick="showTab(\'menu\')">Manage menu</button><button class="ghost" onclick="showTab(\'promotions\')">Post promotion</button></div>';
}
function renderList(kind){
 const rows=state[kind]||[];
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">'+kind[0].toUpperCase()+kind.slice(1)+'</h3>'+
 (rows.length?rows.map(x=>{
  const name=esc(x.profiles?.full_name||'Customer');
  const detail=kind==='bookings'?esc(x.check_in+' → '+x.check_out+' · '+x.guests+' guest(s) · '+(x.room_types?.name||'room')):kind==='reservations'?esc(x.reservation_date+' · '+x.reservation_time+' · '+x.party_size+' guest(s) · '+(x.profiles?.phone||x.contact_phone||'')):esc('ETB '+(x.total??0)+(x.table_number?' · Table '+x.table_number:''));
  let actions='';
  if(kind==='bookings'||kind==='reservations'){
    if(x.status==='requested') actions='<div class="actions"><button onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'confirmed\')">Accept</button><button class="danger" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'cancelled\')">Reject</button><button class="ghost" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'changed\')">Request change</button></div>';
    else if(x.status==='confirmed') actions='<div class="actions"><button class="ghost" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'changed\')">Change</button><button class="danger" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'cancelled\')">Cancel</button><button onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'completed\')">Complete</button></div>';
    else if(x.status==='changed') actions='<div class="actions"><button onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'confirmed\')">Accept change</button><button class="danger" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'cancelled\')">Reject</button></div>';
  } else {
    if(x.status==='placed') actions='<div class="actions"><button onclick="updateStatus(\'orders\',\''+x.id+'\',\'confirmed\')">Accept order</button><button class="danger" onclick="updateStatus(\'orders\',\''+x.id+'\',\'cancelled\')">Reject order</button></div>';
    else if(x.status==='confirmed') actions='<div class="muted">Order accepted. The customer will receive status updates when the order progresses.</div>';
  }
  return '<div class="item"><div class="row"><strong>'+name+'</strong><span class="pill">'+esc(x.status)+'</span></div><div class="muted">'+detail+'</div>'+(x.special_request?'<div class="muted">Request: '+esc(x.special_request)+'</div>':'')+(x.customer_note?'<div class="muted">Note: '+esc(x.customer_note)+'</div>':'')+actions+'</div>';
 }).join(''):'<div class="muted">Nothing here yet.</div>');
}
async function updateStatus(kind,id,status){
 const action=kind==='bookings'?'update_booking':kind==='reservations'?'update_reservation':'update_order';
 const labels={confirmed:'Accept',cancelled:'Reject/Cancel',changed:'Request change',completed:'Complete',preparing:'Mark preparing',ready:'Mark ready',delivered:'Mark delivered'};
 const label=labels[status]||'Update';
 if(!confirm(label+' this '+(kind==='bookings'?'booking':kind==='reservations'?'reservation':'order')+'?')) return;
 try{
  await api(action,{id,status});
  await bootstrap();
  showTab(kind);
 }catch(e){ alert(e.message||'Could not update request.'); }
}

function notifyNewRequest(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(AudioCtx){const ac=new AudioCtx();const now=ac.currentTime;[0,0.18].forEach((delay,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i?880:660;g.gain.setValueAtTime(0.0001,now+delay);g.gain.exponentialRampToValueAtTime(0.18,now+delay+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.16);o.connect(g);g.connect(ac.destination);o.start(now+delay);o.stop(now+delay+0.18)});setTimeout(()=>ac.close(),600)}
  }catch(_){}
  try{tg?.HapticFeedback?.notificationOccurred('warning')}catch(_){}
  if(tg) tg.showAlert?.('New FineTime request received. Open the request to accept or reject it.');
  document.title='🔔 New request · FineTime Partner';
  setTimeout(()=>document.title='FineTime Partner',3000);
}
function renderMenu(){
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Digital menu</h3><p class="muted">Add categories and manage food/drink items, prices, photos and availability.</p>'+
 '<div class="actions"><button type="button" onclick="openCategoryForm()">+ Category</button><button type="button" class="ghost" onclick="openItemForm()">+ Menu item</button></div>'+
 state.categories.map(c=>'<div class="item"><div class="row"><strong>'+esc(c.name)+'</strong><span class="pill">'+(c.menu_items?.length||0)+' items</span></div><div class="actions"><button type="button" class="ghost" data-edit-category="'+esc(c.id)+'">Edit category</button></div>'+
 (c.menu_items||[]).map(i=>'<div class="item"><div class="row"><strong>'+esc(i.name)+'</strong><span class="pill">ETB '+esc(i.price??'—')+'</span></div><div class="muted">'+esc(i.description||'')+' · '+(i.is_available?'Available':'Unavailable')+'</div><div class="actions"><button type="button" class="ghost" data-edit-item="'+esc(i.id)+'">Edit</button><button type="button" class="danger" data-delete-item="'+esc(i.id)+'">Delete</button></div></div>').join('')+'</div>').join('');
 document.querySelectorAll('[data-edit-category]').forEach(btn=>btn.onclick=()=>{const c=state.categories.find(x=>String(x.id)===String(btn.dataset.editCategory));if(c)openCategoryForm(c)});
 document.querySelectorAll('[data-edit-item]').forEach(btn=>btn.onclick=()=>{let item=null;for(const c of state.categories){item=(c.menu_items||[]).find(x=>String(x.id)===String(btn.dataset.editItem));if(item)break}if(item)openItemForm(item)});
 document.querySelectorAll('[data-delete-item]').forEach(btn=>btn.onclick=()=>deleteItem(btn.dataset.deleteItem));
}
function openCategoryForm(c=null){
 document.getElementById('content').innerHTML='<div class="formHead"><div><h3 class="sectionTitle">'+(c?'Edit category':'Add menu category')+'</h3><div class="muted">Keep the category details together on one page.</div></div><button class="ghost" type="button" onclick="showTab(\'menu\')">Back</button></div>'+
 '<form id="categoryEditor" onsubmit="return saveCategoryForm(event,'+(c?JSON.stringify(c.id):'null')+')">'+
 '<section class="formSection"><h4>Category details</h4><div class="formGrid">'+
 '<div class="field full"><label>Category name *</label><input name="name" required value="'+attr(c?.name||'')" placeholder="Starters, Main dishes, Drinks…"></div>'+
 '<div class="field"><label>Sort order</label><input name="sort_order" type="number" value="'+attr(c?.sort_order??0)+'"></div>'+
 '</div></section><div class="formActions"><button type="submit">'+(c?'Save category':'Create category')+'</button><button type="button" class="ghost" onclick="showTab(\'menu\')">Cancel</button></div></form>';
}
async function saveCategoryForm(event,id){
 event.preventDefault();
 const fd=new FormData(event.currentTarget),name=String(fd.get('name')||'').trim(),sort=Number(fd.get('sort_order')||0);
 if(!name)return alert('Category name is required.');
 try{await api('upsert_category',{id,name,sort_order:Number.isFinite(sort)?sort:0});await bootstrap();showTab('menu')}catch(e){alert(e.message||'Could not save category.')}
}
async function openItemForm(item=null){
 const categoryId=item?.category_id||state.categories[0]?.id;
 if(!categoryId)return alert('Create a category first.');
 const options=state.categories.map(c=>'<option value="'+c.id+'" '+(String(c.id)===String(categoryId)?'selected':'')+'>'+esc(c.name)+'</option>').join('');
 document.getElementById('content').innerHTML='<div class="formHead"><div><h3 class="sectionTitle">'+(item?'Edit menu item':'Add menu item')+'</h3><div class="muted">Enter the full menu item once, including its photo and availability.</div></div><button class="ghost" type="button" onclick="showTab(\'menu\')">Back</button></div>'+
 '<form id="itemEditor" onsubmit="return saveItemForm(event,'+(item?JSON.stringify(item.id):'null')+')">'+
 '<section class="formSection"><h4>Menu item</h4><div class="formGrid">'+
 '<div class="field"><label>Category *</label><select name="category_id" required>'+options+'</select></div>'+
 '<div class="field"><label>Item name *</label><input name="name" required value="'+attr(item?.name||'')" placeholder="Doro wat"></div>'+
 '<div class="field"><label>Price (ETB) *</label><input name="price" required type="number" min="0" step="0.01" value="'+attr(item?.price??'')+'"></div>'+
 '<div class="field"><label class="check"><input name="is_available" type="checkbox" '+(item?.is_available!==false?'checked':'')+'> Available for ordering</label></div>'+
 '<div class="field full"><label>Description</label><textarea name="description" placeholder="Ingredients, portion, serving details…">'+esc(item?.description||'')+'</textarea></div>'+
 '<div class="field full"><label>Photo</label><input id="itemPhotoUrl" name="photo_url" value="'+attr(item?.photo_url||'')" placeholder="https://…"><div class="actions"><button type="button" class="ghost" onclick="uploadInto(\'itemPhotoUrl\',false)">Upload from device</button></div><img id="itemPhotoPreview" class="preview" '+(item?.photo_url?'src="'+attr(item.photo_url)+'"':'style="display:none"')+' alt="Menu item preview"></div>'+
 '</div></section><div class="formActions"><button type="submit">'+(item?'Save item':'Create menu item')+'</button><button type="button" class="ghost" onclick="showTab(\'menu\')">Cancel</button></div></form>';
 document.getElementById('itemPhotoUrl').addEventListener('input',e=>{const p=document.getElementById('itemPhotoPreview');p.src=e.target.value;p.style.display=e.target.value?'block':'none'});
}
async function saveItemForm(event,id){
 event.preventDefault();const fd=new FormData(event.currentTarget),name=String(fd.get('name')||'').trim(),price=Number(fd.get('price'));

async function saveRoomForm(event,id){

async function saveInventory(roomId,date,total){
 const value=Number(document.getElementById('a-'+roomId+'-'+date).value),blocked=document.getElementById('b-'+roomId+'-'+date).checked;
 if(!Number.isInteger(value)||value<0||value>total)return alert('Available rooms must be between 0 and '+total+'.');
 try{await api('update_inventory',{room_type_id:roomId,inventory_date:date,available_rooms:value,blocked});await bootstrap();showTab('rooms')}catch(e){alert(e.message)}
}
function nextDates(days){const a=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<days;i++){const x=new Date(d);x.setDate(x.getDate()+i);a.push(x.toISOString().slice(0,10))}return a}
