<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>FineTime Partner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<style>
:root {
  --obsidian: #0C0A06;
  --surface: #17140F;
  --surface-card: #1D1913;
  --surface-light: #26211A;
  --border: rgba(227, 168, 45, 0.18);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --gold: #E3A82D;
  --gold-light: #EEB843;
  --gold-dark: #B48728;
  --gold-glow: rgba(227, 168, 45, 0.35);
  --gold-gradient: linear-gradient(135deg, #E3A82D 0%, #EEB843 100%);
  --ivory: #F5F1E8;
  --cream: #D2D0CA;
  --muted: #8E8982;
  --danger: #9E3524;
  --danger-bg: rgba(158, 53, 36, 0.15);
  --success: #3EB868;
  --success-bg: rgba(62, 184, 104, 0.12);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-gold: 0 4px 18px rgba(227, 168, 45, 0.28);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background-color: var(--obsidian);
  background-image: 
    radial-gradient(ellipse at 50% 0%, rgba(227, 168, 45, 0.08) 0%, transparent 65%),
    radial-gradient(ellipse at 100% 100%, rgba(227, 168, 45, 0.04) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--ivory);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding-bottom: 50px;
}

main {
  max-width: 680px;
  margin: auto;
  padding: 16px 14px 40px;
}

/* Header & Brand */
.brand-header {
  padding: 6px 4px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 3.5px;
  color: var(--ivory);
  display: flex;
  align-items: center;
  gap: 7px;
}
.brand-title span.dot {
  color: var(--gold);
  font-size: 18px;
}
.brand-tagline {
  color: var(--gold);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  margin-top: 3px;
}
.portal-badge {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 5px 10px;
  border-radius: var(--radius-pill);
  background: rgba(227, 168, 45, 0.12);
  color: var(--gold);
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-top: 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.card.gold-border {
  border-color: var(--border);
}

/* Business Hero Card */
.business-card {
  background: linear-gradient(145deg, #1C1812 0%, #15120D 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-top: 10px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  position: relative;
}
.business-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0; width: 140px; height: 140px;
  background: radial-gradient(circle at 100% 0%, rgba(227, 168, 45, 0.14) 0%, transparent 70%);
  pointer-events: none;
}
.biz-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--ivory);
  letter-spacing: -0.2px;
  margin: 0 0 6px;
  line-height: 1.2;
}
.biz-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--cream);
}
.live-dot {
  width: 7px;
  height: 7px;
  background: var(--success);
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 8px var(--success);
}

/* Nav Tabs */
.nav-container {
  overflow-x: auto;
  padding: 8px 0 4px;
  margin-top: 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-container::-webkit-scrollbar { display: none; }
.nav-pills {
  display: flex;
  gap: 8px;
  min-width: max-content;
}
.nav-pills button {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  color: var(--cream);
  font-weight: 700;
  font-size: 13px;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-pills button:active {
  transform: scale(0.97);
}
.nav-pills button.active {
  background: var(--gold-gradient);
  color: #1E1607;
  border-color: transparent;
  box-shadow: var(--shadow-gold);
  font-weight: 800;
}
.nav-pills button .badge {
  background: #1E1607;
  color: var(--gold);
  font-size: 10px;
  font-weight: 900;
  padding: 2px 7px;
  border-radius: 999px;
}
.nav-pills button.active .badge {
  background: #1E1607;
  color: var(--gold-light);
}

/* KPI Overview Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0;
}
.kpi-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  text-align: center;
  transition: transform 0.15s ease;
}
.kpi-icon {
  font-size: 18px;
  margin-bottom: 4px;
}
.kpi-value {
  font-size: 24px;
  font-weight: 800;
  color: var(--gold);
  line-height: 1.1;
  font-family: 'Playfair Display', Georgia, serif;
}
.kpi-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Section Headings */
.sectionTitle {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--ivory);
  margin: 0 0 6px;
  letter-spacing: -0.2px;
}
.subText {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 14px;
}

/* Lists & Items */
.item-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 15px;
  margin-bottom: 12px;
  transition: border-color 0.2s ease;
}
.item-card:hover {
  border-color: var(--border);
}
.item-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 6px;
}
.item-title {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--ivory);
}
.item-desc {
  color: var(--cream);
  font-size: 13px;
  margin-top: 4px;
  line-height: 1.45;
}
.item-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Badges & Pills */
.pill {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 4px 9px;
  border-radius: var(--radius-pill);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.pill.gold {
  background: rgba(227, 168, 45, 0.15);
  color: var(--gold);
  border: 1px solid rgba(227, 168, 45, 0.35);
}
.pill.active, .pill.confirmed {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid rgba(62, 184, 104, 0.3);
}
.pill.requested, .pill.placed {
  background: rgba(238, 184, 67, 0.15);
  color: var(--gold-light);
  border: 1px solid rgba(238, 184, 67, 0.4);
}
.pill.cancelled, .pill.rejected {
  background: var(--danger-bg);
  color: #FF8A7A;
  border: 1px solid rgba(158, 53, 36, 0.3);
}

/* Promotion Image Preview in Card */
.promo-preview-thumb {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  border: 1px solid var(--border-subtle);
}

/* Action Buttons */
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.18s ease;
}
button:active {
  transform: scale(0.97);
}
.btn-gold {
  background: var(--gold-gradient);
  color: #1E1607;
  font-weight: 800;
  box-shadow: 0 3px 12px rgba(227, 168, 45, 0.25);
}
.btn-gold:hover {
  box-shadow: var(--shadow-gold);
}
.btn-ghost {
  background: var(--surface-light);
  color: var(--ivory);
  border: 1px solid var(--border-subtle);
}
.btn-ghost:hover {
  border-color: var(--border);
  color: var(--gold);
}
.btn-danger {
  background: var(--danger-bg);
  color: #FF9B8E;
  border: 1px solid rgba(158, 53, 36, 0.4);
}
.btn-danger:hover {
  background: var(--danger);
  color: #fff;
}
.btn-sm {
  padding: 7px 13px;
  font-size: 12px;
}

/* Forms & Inputs */
input, textarea, select {
  font-family: inherit;
  font-size: 14px;
  width: 100%;
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  border: 1px solid var(--border-subtle);
  background: #14110C;
  color: var(--ivory);
  margin-top: 5px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(227, 168, 45, 0.2);
}
textarea {
  min-height: 90px;
  resize: vertical;
}
.formSection {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  margin: 14px 0;
}
.formSection h4 {
  margin: 0 0 12px;
  color: var(--gold);
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.formGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.field {
  display: flex;
  flex-direction: column;
}
.field.full {
  grid-column: 1 / -1;
}
.field label {
  color: var(--cream);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.field .help {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}
.check {
  display: flex !important;
  flex-direction: row !important;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  cursor: pointer;
}
.check input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--gold);
}
.preview-img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  margin-top: 10px;
  border: 1px solid var(--border);
}

/* 14-Day Calendar Inventory */
.inventory-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.day-cell {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 12px;
}
.day-cell strong {
  color: var(--gold);
}

/* Utilities */
.hidden { display: none !important; }
.muted { color: var(--muted); }
.error { color: #FF9B8E; font-size: 13px; margin-top: 8px; }
.ok { color: var(--success); font-size: 13px; margin-top: 8px; }

@media (max-width: 520px) {
  .formGrid, .inventory-grid { grid-template-columns: 1fr; }
  .kpi-grid { gap: 6px; }
  .kpi-value { font-size: 20px; }
}
</style>
</head>
<body>
<main>
  <!-- Header Branding -->
  <header class="brand-header">
    <div>
      <div class="brand-title">
        FINETIME<span class="dot">✦</span>CC
      </div>
      <div class="brand-tagline sub-title">PARTNER WORKSPACE</div>
    </div>
    <div class="portal-badge">
      <span>●</span> LIVE PORTAL
    </div>
  </header>

  <!-- Connect Section -->
  <section id="connect" class="card gold-border">
    <h2 class="sectionTitle">Connect your business</h2>
    <p class="subText">Enter the secure activation code issued by FineTime Admin. Your Telegram account will be securely linked to your venue.</p>
    <form id="connectForm">
      <input id="code" placeholder="Enter activation code (e.g. SKY-2026)" autocomplete="off">
      <div class="actions" style="margin-top:14px">
        <button id="connectBusinessButton" type="submit" class="btn-gold">Connect Business ➔</button>
      </div>
    </form>
    <div id="connectError" class="error"></div>
  </section>

  <!-- Main App Section -->
  <section id="app" class="hidden">
    <!-- Business Hero Card -->
    <div id="business" class="business-card"></div>

    <!-- Navigation Pills -->
    <div class="nav-container">
      <div id="nav" class="nav-pills"></div>
    </div>

    <!-- Active Tab Content Card -->
    <div id="content" class="card"></div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://atewcbkuzrnfnmzsylze.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CxfreIiozKEB-GcvNOCyhQ_RVnIgGVG';
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let state = {
  business: null,
  bookings: [],
  reservations: [],
  orders: [],
  rooms: [],
  inventory: [],
  categories: [],
  promotions: [],
  subscription: null
};
let tab = 'overview';
let firstBootstrap = true;
let previousRequestKey = '';
let pollTimer = null;

function haptic(type = 'light') {
  try {
    if (tg?.HapticFeedback) {
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
      else tg.HapticFeedback.impactOccurred(type);
    }
  } catch (_) {}
}

function initData() { return tg?.initData || ''; }
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
function attr(value) { return esc(value); }
function editorOpen() { return !!document.querySelector('#content form'); }

async function api(action, extra = {}) {
  const telegramInitData = initData();
  if (!telegramInitData) {
    throw new Error('Please open this Partner Mini App directly from the FineTime Telegram Bot.');
  }
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 14000);
  let r;
  try {
    r = await fetch(SUPABASE_URL + '/functions/v1/partner-api', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ action, initData: telegramInitData, ...extra }),
      signal: controller.signal
    });
  } catch (e) {
    if (e?.name === 'AbortError') throw new Error('Request timed out. Please check your connection.');
    throw e;
  } finally {
    clearTimeout(timeout);
  }

  const text = await r.text();
  let d;
  try { d = JSON.parse(text); } catch (_) {
    throw new Error('Invalid response from partner service. Please try again.');
  }
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

async function uploadImageFile(file) {
  if (!file) return null;
  if (!file.type.startsWith('image/')) throw new Error('Please choose an image file (JPEG, PNG, WebP).');
  if (file.size > 8 * 1024 * 1024) throw new Error('Image must be 8 MB or smaller.');
  const meta = await api('create_media_upload', { file_name: file.name, mime_type: file.type });
  const cleanPath = String(meta.path || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const signedUrl = SUPABASE_URL + '/storage/v1/object/upload/sign/business-media/' + cleanPath + '?token=' + encodeURIComponent(meta.token);
  const form = new FormData();
  form.append('cacheControl', '3600');
  form.append('', file, file.name);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);
  try {
    const response = await fetch(signedUrl, {
      method: 'PUT',
      headers: { apikey: SUPABASE_KEY, 'x-upsert': 'false' },
      body: form,
      signal: controller.signal
    });
    const text = await response.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch {}
    if (!response.ok) throw new Error(data?.message || data?.error || text || ('Image upload failed (' + response.status + ').'));
  } catch (e) {
    if (e?.name === 'AbortError') throw new Error('Image upload timed out. Please try again.');
    throw e;
  } finally {
    clearTimeout(timeout);
  }
  return meta.public_url;
}

function pickImages(multiple = false) {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/jpeg,image/png,image/webp,image/gif';
    input.multiple = multiple;
    input.onchange = async () => {
      try {
        const files = Array.from(input.files || []);
        if (!files.length) { resolve([]); return; }
        const urls = [];
        for (const file of files) urls.push(await uploadImageFile(file));
        resolve(urls);
      } catch (e) { reject(e); }
    };
    input.click();
  });
}

async function uploadInto(fieldId, multiple = false) {
  haptic('medium');
  try {
    const urls = await pickImages(multiple);
    if (urls[0]) {
      const el = document.getElementById(fieldId);
      el.value = multiple ? [...(el.value ? el.value.split(',').map(x => x.trim()).filter(Boolean) : []), ...urls].join(', ') : urls[0];
      el.dispatchEvent(new Event('input', { bubbles: true }));
      haptic('success');
    }
  } catch (e) {
    haptic('warning');
    alert(e.message || 'Could not upload image.');
  }
}

async function uploadCoverFromDevice() {
  haptic('medium');
  try {
    const urls = await pickImages(false);
    if (urls[0]) {
      document.getElementById('bc').value = urls[0];
      haptic('success');
    }
  } catch (e) {
    haptic('warning');
    alert(e.message || 'Could not upload image.');
  }
}

async function uploadGalleryFromDevice() {
  haptic('medium');
  try {
    const urls = await pickImages(true);
    if (urls.length) {
      const current = document.getElementById('bg').value.split(',').map(x => x.trim()).filter(Boolean);
      document.getElementById('bg').value = [...current, ...urls].join(', ');
      haptic('success');
    }
  } catch (e) {
    haptic('warning');
    alert(e.message || 'Could not upload images.');
  }
}

async function activate(event) {
  event?.preventDefault();
  haptic('medium');
  const error = document.getElementById('connectError');
  const button = document.getElementById('connectBusinessButton');
  const code = document.getElementById('code').value.trim();
  error.className = 'muted';
  error.textContent = 'Connecting to FineTime…';
  if (button) { button.disabled = true; button.textContent = 'Connecting…'; }
  try {
    if (!code) throw new Error('Please enter your activation code.');
    try {
      await api('activate', { code });
    } catch (e) {
      if (!e?.message?.toLowerCase().includes('already connected')) throw e;
    }
    await bootstrap();
    haptic('success');
    error.textContent = '';
  } catch (e) {
    haptic('warning');
    error.className = 'error';
    error.textContent = e.message || 'Could not connect. Please verify your activation code.';
  } finally {
    if (button) { button.disabled = false; button.textContent = 'Connect Business ➔'; }
  }
}
document.getElementById('connectForm')?.addEventListener('submit', activate);
window.activate = activate;

async function autoConnect() {
  try {
    document.getElementById('connectError').className = 'muted';
    document.getElementById('connectError').textContent = initData() ? 'Verifying Telegram credentials…' : 'Open this page from the FineTime Partner button in Telegram.';
    if (!initData()) return;
    await bootstrap();
    document.getElementById('connectError').textContent = '';
  } catch (e) {
    document.getElementById('connectError').className = 'error';
    document.getElementById('connectError').textContent = e.message || 'Please enter your activation code.';
  }
}

async function bootstrap() {
  try {
    const d = await api('bootstrap');
    const nextState = {
      business: d.business || null,
      bookings: d.bookings || [],
      reservations: d.reservations || [],
      orders: d.orders || [],
      rooms: d.rooms || [],
      inventory: d.inventory || [],
      categories: d.categories || [],
      promotions: d.promotions || [],
      subscription: d.subscription || null
    };

    const requestKey = [
      ...nextState.bookings.filter(x => x.status === 'requested').map(x => 'b:' + x.id),
      ...nextState.reservations.filter(x => x.status === 'requested').map(x => 'r:' + x.id),
      ...nextState.orders.filter(x => x.status === 'placed').map(x => 'o:' + x.id)
    ].sort().join('|');

    if (!firstBootstrap && requestKey !== previousRequestKey) notifyNewRequest();
    previousRequestKey = requestKey;
    firstBootstrap = false;

    const keepEditor = editorOpen();
    state = nextState;

    document.getElementById('connect').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    const b = state.business || {};
    const categoryName = (b.category || 'Partner').toUpperCase();
    const isPub = b.is_published;

    document.getElementById('business').innerHTML = 
      '<div class="biz-name">' + esc(b.name || 'FineTime Partner') + '</div>' +
      '<div class="biz-meta">' +
        '<span class="pill gold">' + esc(categoryName) + '</span>' +
        '<span><span class="live-dot" style="background:' + (isPub ? 'var(--success)' : '#E3A82D') + '"></span> ' + (isPub ? 'Live on FineTime' : 'Draft / Unpublished') + '</span>' +
      '</div>';

    renderNav();
    if (!keepEditor) render();
    if (!pollTimer) pollTimer = setInterval(() => bootstrap().catch(() => {}), 10000);
  } catch (e) {
    const message = e?.message || 'Partner connection failed.';
    document.getElementById('connectError').className = 'error';
    document.getElementById('connectError').textContent = message;
    throw e;
  }
}

async function updateStatus(kind, id, status) {
  const action = kind === 'bookings' ? 'update_booking' : kind === 'reservations' ? 'update_reservation' : 'update_order';
  const labels = {
    confirmed: 'Accept', cancelled: 'Decline/Cancel', changed: 'Request change',
    completed: 'Mark completed', preparing: 'Mark preparing', ready: 'Mark ready', delivered: 'Mark delivered'
  };
  const label = labels[status] || 'Update';
  if (!confirm(label + ' this ' + (kind === 'bookings' ? 'booking' : kind === 'reservations' ? 'reservation' : 'order') + '?')) return;
  try {
    await api(action, { id, status });
    await bootstrap();
    showTab(kind);
  } catch (e) {
    alert(e.message || 'Could not update request.');
  }
}

function notifyNewRequest() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ac = new AudioCtx();
      const now = ac.currentTime;
      [0, 0.18].forEach((delay, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = i ? 880 : 660;
        g.gain.setValueAtTime(0.0001, now + delay);
        g.gain.exponentialRampToValueAtTime(0.18, now + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.16);
        o.connect(g);
        g.connect(ac.destination);
        o.start(now + delay);
        o.stop(now + delay + 0.18);
      });
      setTimeout(() => ac.close(), 600);
    }
  } catch (_) {}
  try { tg?.HapticFeedback?.notificationOccurred('warning'); } catch (_) {}
  if (tg) tg.showAlert?.('New FineTime request received. Open the request to accept or reject it.');
  document.title = '🔔 New request · FineTime Partner';
  setTimeout(() => document.title = 'FineTime Partner Portal', 3000);
}

async function savePromoForm(event, id) {
  event.preventDefault();
  haptic('medium');
  const fd = new FormData(event.currentTarget);
  const title = String(fd.get('title') || '').trim();
  const badge = String(fd.get('badge') || 'FEATURED');
  if (!title) return alert('Promotion title is required.');

  try {
    await api('upsert_promotion', {
      id,
      title,
      description: String(fd.get('description') || '').trim() || null,
      badge,
      starts_on: String(fd.get('starts_on') || '') || null,
      ends_on: String(fd.get('ends_on') || '') || null,
      status: String(fd.get('status') || 'active'),
      image_url: String(fd.get('image_url') || '').trim() || null,
      terms: String(fd.get('terms') || '').trim() || null
    });
    haptic('success');
    await bootstrap();
    showTab('promotions');
  } catch (e) {
    haptic('warning');
    alert(e.message || 'Could not save promotion.');
  }
}

async function saveRoomForm(event, id) {
  event.preventDefault();
  haptic('medium');
  const fd = new FormData(event.currentTarget), name = String(fd.get('name') || '').trim(), total = Number(fd.get('total_rooms')), capacity = Number(fd.get('capacity')), priceRaw = String(fd.get('public_price') || '');

  const price = priceRaw === '' ? null : Number(priceRaw);
  if (price !== null && (!Number.isFinite(price) || price < 0)) return alert('Enter a valid room price.');
  try {
    await api('upsert_room', {
      id,
      name,
      total_rooms: total,
      capacity,
      public_price: price,
      description: String(fd.get('description') || '').trim() || null,
      beds: String(fd.get('beds') || '').trim() || null,
      amenities: String(fd.get('amenities') || '').split(',').map(x => x.trim()).filter(Boolean),
      photo_url: String(fd.get('photo_url') || '').trim() || null
    });
    haptic('success');
    await bootstrap();
    showTab('rooms');
  } catch (e) {
    alert(e.message || 'Could not save room type.');
  }
}

async function saveInventory(roomId, date, total) {
  const value = Number(document.getElementById('a-' + roomId + '-' + date).value);
  const blocked = document.getElementById('b-' + roomId + '-' + date).checked;
  if (!Number.isInteger(value) || value < 0 || value > total) return alert('Available rooms must be between 0 and ' + total + '.');
  try {
    await api('update_inventory', { room_type_id: roomId, inventory_date: date, available_rooms: value, blocked });
    haptic('success');
    await bootstrap();
    showTab('rooms');
  } catch (e) {
    alert(e.message);
  }
}

function nextDates(days) {
  const a = [], d = new Date();
  d.setHours(0, 0, 0, 0);
  for (let i = 0; i < days; i++) {
    const x = new Date(d);
    x.setDate(x.getDate() + i);
    a.push(x.toISOString().slice(0, 10));
  }
  return a;
}
