<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FineTime Partner</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--charcoal:#121212;--panel:#1b1b1b;--panel2:#222;--gold:#c9a227;--ivory:#f5f1e8;--muted:#a0a0a0;--danger:#7b3020}
*{box-sizing:border-box}body{margin:0;background:var(--charcoal);color:var(--ivory);font:15px system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto;padding:18px 14px 44px}.brand{color:var(--gold);font-weight:900;letter-spacing:3px;font-size:22px}.sub{color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid #ffffff12;border-radius:16px;padding:16px;margin-top:14px}
input,textarea,select,button{font:inherit;border-radius:11px;padding:11px 12px}input,textarea,select{width:100%;border:0;background:#fff;color:#121212;margin-top:6px}textarea{min-height:80px;resize:vertical}
button{border:0;background:var(--gold);color:#121212;font-weight:800;cursor:pointer}.ghost{background:transparent;color:var(--ivory);border:1px solid #ffffff22}.danger{background:var(--danger);color:#fff}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.nav button{padding:10px 6px}.nav button.active{outline:2px solid var(--gold)}
.item{padding:14px 0;border-bottom:1px solid #ffffff10}.item:last-child{border-bottom:0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{font-size:11px;background:#ffffff10;padding:5px 8px;border-radius:999px}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.error{color:#ffb4a8;margin-top:10px}.ok{color:#9fd6a4;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{padding:8px 10px}.sectionTitle{margin:0 0 5px}.label{display:block;color:var(--muted);font-size:12px;margin-top:8px}
.inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.day{background:#ffffff08;border:1px solid #ffffff10;border-radius:12px;padding:10px}.day button{width:100%;padding:8px}.day label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:5px}
@media(max-width:620px){.grid,.grid3{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.inventory{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="brand">FINETIME</div><div class="sub">Unified Partner · Hotel · Restaurant · Café</div>

<section id="connect" class="card">
<h2>Connect your business</h2>
<p class="muted">Use the activation code supplied by FineTime Admin. Your Telegram identity is bound to the authorized business.</p>
<input id="code" placeholder="Activation code" autocomplete="off">
<div class="actions"><button onclick="activate()">Connect Business</button></div>
<div id="connectError" class="error"></div>
</section>

<section id="app" class="hidden">
<div id="business" class="card"></div>
<div id="nav" class="nav"></div>
<div id="content" class="card"></div>
</section>
</main>

<script>
const SUPABASE_URL='__SUPABASE_URL__';
const SUPABASE_KEY='__SUPABASE_ANON_KEY__';
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();

let state={business:null,bookings:[],reservations:[],orders:[],rooms:[],inventory:[],categories:[],promotions:[],subscription:null};
let tab='overview';
let firstBootstrap=true;
let previousRequestKey='';
let pollTimer=null;

function initData(){return tg?.initData||''}
async function api(action,extra={}){
 const r=await fetch(SUPABASE_URL+'/functions/v1/partner-api',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action,initData:initData(),...extra})});
 const d=await r.json(); if(!r.ok)throw new Error(d.error||'Request failed'); return d;
}
async function activate(){try{await api('activate',{code:document.getElementById('code').value});await bootstrap()}catch(e){document.getElementById('connectError').textContent=e.message}}
async function bootstrap(){
 try{
  const d=await api('bootstrap');
  const nextState={business:d.business||null,bookings:d.bookings||[],reservations:d.reservations||[],orders:d.orders||[],rooms:d.rooms||[],inventory:d.inventory||[],categories:d.categories||[],promotions:d.promotions||[],subscription:d.subscription||null};
  const requestKey=[...nextState.bookings.filter(x=>x.status==='requested').map(x=>'b:'+x.id),...nextState.reservations.filter(x=>x.status==='requested').map(x=>'r:'+x.id),...nextState.orders.filter(x=>x.status==='placed').map(x=>'o:'+x.id)].sort().join('|');
  if(!firstBootstrap && requestKey!==previousRequestKey) notifyNewRequest();
  previousRequestKey=requestKey;
  firstBootstrap=false;
  state=nextState;
  document.getElementById('connect').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('business').innerHTML='<h2>'+esc(state.business?.name||'FineTime Partner')+'</h2><div class="muted">'+esc(state.business?.category||'')+' · '+(state.business?.is_published?'Published':'Not published')+'</div>';
  renderNav();render();
  if(!pollTimer) pollTimer=setInterval(()=>bootstrap(),10000);
 }catch(e){document.getElementById('connectError').textContent=e.message}
}
function renderNav(){
 const category=String(state.business?.category||'').toLowerCase();
 const isHotel=category==='hotel';
 const hasFood=(state.categories||[]).length>0;
 const pending=(isHotel?state.bookings.filter(x=>x.status==='requested').length:state.reservations.filter(x=>x.status==='requested').length)+((!isHotel||hasFood)?state.orders.filter(x=>x.status==='placed').length:0);
 const tabs=[['overview','Overview']];
 if(isHotel) tabs.push(['bookings','Bookings'],['rooms','Rooms']);
 else tabs.push(['reservations','Reservations']);
 if(!isHotel||hasFood) tabs.push(['orders','Orders'],['menu','Menu']);
 tabs.push(['promotions','Promotions'],['settings','Business']);
 document.getElementById('nav').innerHTML=tabs.map(([id,label])=>'<button class="'+(tab===id?'active':'ghost')+'" data-tab="'+id+'">'+label+(id==='overview'&&pending?' <span class="pill">'+pending+' NEW</span>':'')+'</button>').join('');
 document.querySelectorAll('#nav [data-tab]').forEach(button=>button.onclick=()=>showTab(button.dataset.tab));
 const brandSub=document.querySelector('.sub');
 if(brandSub) brandSub.textContent=isHotel?'Hotel Partner · FineTime':'Restaurant & Café Partner · FineTime';
}
function showTab(t){tab=t;renderNav();render()}
function render(){const f={overview:renderOverview,bookings:()=>renderList('bookings'),reservations:()=>renderList('reservations'),orders:()=>renderList('orders'),menu:renderMenu,rooms:renderRooms,promotions:renderPromotions,settings:renderSettings};f[tab]()}
function renderOverview(){
 const b=state.business||{};const s=state.subscription;
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Partner overview</h3>'+
 '<div class="grid3"><div class="item"><strong>'+state.bookings.length+'</strong><div class="muted">Recent bookings</div></div><div class="item"><strong>'+state.reservations.length+'</strong><div class="muted">Reservations</div></div><div class="item"><strong>'+state.orders.length+'</strong><div class="muted">Orders</div></div></div>'+
 '<div class="item"><strong>Subscription</strong><div class="muted">'+esc(s?.plan||'Not configured')+' · '+esc(s?.status||'Contact FineTime')+'</div></div>'+
 '<div class="item"><strong>Public profile</strong><div class="muted">'+(b.is_published?'Published on FineTime':'Not published yet')+'</div></div>'+
 '<div class="actions"><button onclick="showTab(\'settings\')">Edit business</button><button class="ghost" onclick="showTab(\'menu\')">Manage menu</button><button class="ghost" onclick="showTab(\'promotions\')">Post promotion</button></div>';
}
function renderList(kind){
 const rows=state[kind]||[];
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">'+kind[0].toUpperCase()+kind.slice(1)+'</h3>'+
 (rows.length?rows.map(x=>{
  const name=esc(x.profiles?.full_name||'Customer');
  const detail=kind==='bookings'?esc(x.check_in+' → '+x.check_out+' · '+x.guests+' guest(s) · '+(x.room_types?.name||'room')):kind==='reservations'?esc(x.reservation_date+' · '+x.reservation_time+' · '+x.party_size+' guest(s) · '+(x.profiles?.phone||x.contact_phone||'')):esc('ETB '+(x.total??0)+(x.table_number?' · Table '+x.table_number:''));
  let actions='';
  if(kind==='bookings'||kind==='reservations'){
    if(x.status==='requested') actions='<div class="actions"><button onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'confirmed\')">Accept</button><button class="danger" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'cancelled\')">Reject</button><button class="ghost" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'changed\')">Request change</button></div>';
    else if(x.status==='confirmed') actions='<div class="actions"><button class="ghost" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'changed\')">Change</button><button class="danger" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'cancelled\')">Cancel</button><button onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'completed\')">Complete</button></div>';
    else if(x.status==='changed') actions='<div class="actions"><button onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'confirmed\')">Accept change</button><button class="danger" onclick="updateStatus(\''+kind+'\',\''+x.id+'\',\'cancelled\')">Reject</button></div>';
  } else {
    if(x.status==='placed') actions='<div class="actions"><button onclick="updateStatus(\'orders\',\''+x.id+'\',\'confirmed\')">Accept order</button><button class="danger" onclick="updateStatus(\'orders\',\''+x.id+'\',\'cancelled\')">Reject order</button></div>';
    else if(x.status==='confirmed') actions='<div class="actions"><button onclick="updateStatus(\'orders\',\''+x.id+'\',\'preparing\')">Preparing</button><button class="danger" onclick="updateStatus(\'orders\',\''+x.id+'\',\'cancelled\')">Cancel</button></div>';
    else if(x.status==='preparing') actions='<div class="actions"><button onclick="updateStatus(\'orders\',\''+x.id+'\',\'ready\')">Ready</button><button class="danger" onclick="updateStatus(\'orders\',\''+x.id+'\',\'cancelled\')">Cancel</button></div>';
    else if(x.status==='ready') actions='<div class="actions"><button onclick="updateStatus(\'orders\',\''+x.id+'\',\'delivered\')">Delivered</button><button class="danger" onclick="updateStatus(\'orders\',\''+x.id+'\',\'cancelled\')">Cancel</button></div>';
  }
  return '<div class="item"><div class="row"><strong>'+name+'</strong><span class="pill">'+esc(x.status)+'</span></div><div class="muted">'+detail+'</div>'+(x.special_request?'<div class="muted">Request: '+esc(x.special_request)+'</div>':'')+(x.customer_note?'<div class="muted">Note: '+esc(x.customer_note)+'</div>':'')+actions+'</div>';
 }).join(''):'<div class="muted">Nothing here yet.</div>');
}
async function updateStatus(kind,id,status){
 const action=kind==='bookings'?'update_booking':kind==='reservations'?'update_reservation':'update_order';
 const labels={confirmed:'Accept',cancelled:'Reject/Cancel',changed:'Request change',completed:'Complete',preparing:'Mark preparing',ready:'Mark ready',delivered:'Mark delivered'};
 const label=labels[status]||'Update';
 if(!confirm(label+' this '+(kind==='bookings'?'booking':kind==='reservations'?'reservation':'order')+'?')) return;
 try{
  await api(action,{id,status});
  await bootstrap();
  showTab(kind);
 }catch(e){ alert(e.message||'Could not update request.'); }
}

function notifyNewRequest(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(AudioCtx){const ac=new AudioCtx();const now=ac.currentTime;[0,0.18].forEach((delay,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i?880:660;g.gain.setValueAtTime(0.0001,now+delay);g.gain.exponentialRampToValueAtTime(0.18,now+delay+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.16);o.connect(g);g.connect(ac.destination);o.start(now+delay);o.stop(now+delay+0.18)});setTimeout(()=>ac.close(),600)}
  }catch(_){}
  try{tg?.HapticFeedback?.notificationOccurred('warning')}catch(_){}
  if(tg) tg.showAlert?.('New FineTime request received. Open the request to accept or reject it.');
  document.title='🔔 New request · FineTime Partner';
  setTimeout(()=>document.title='FineTime Partner',3000);
}
function renderMenu(){
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Digital menu</h3><p class="muted">Add categories and manage food/drink items, prices, photos and availability.</p>'+
 '<div class="actions"><button onclick="openCategoryForm()">+ Category</button><button class="ghost" onclick="openItemForm()">+ Menu item</button></div>'+
 state.categories.map(c=>'<div class="item"><div class="row"><strong>'+esc(c.name)+'</strong><span class="pill">'+(c.menu_items?.length||0)+' items</span></div>'+
 (c.menu_items||[]).map(i=>'<div class="item"><div class="row"><strong>'+esc(i.name)+'</strong><span class="pill">ETB '+esc(i.price??'—')+'</span></div><div class="muted">'+esc(i.description||'')+' · '+(i.is_available?'Available':'Unavailable')+'</div><div class="actions"><button class="ghost" onclick="openItemForm('+jsonArg(i)+')">Edit</button><button class="danger" onclick="deleteItem(\''+i.id+'\')">Delete</button></div></div>').join('')+'</div>').join('');
}
function openCategoryForm(c=null){
 const name=prompt('Category name',c?.name||'');if(name===null)return;
 const sort=Number(prompt('Sort order',c?.sort_order??0)||0);
 api('upsert_category',{id:c?.id,name,sort_order:sort}).then(bootstrap).catch(e=>alert(e.message));
}
function openItemForm(item=null){
 const categoryId=item?.category_id||state.categories[0]?.id;if(!categoryId){alert('Create a category first.');return}
 const name=prompt('Item name',item?.name||'');if(name===null)return;
 const priceRaw=prompt('Price in ETB',item?.price??'');if(priceRaw===null)return;
 const description=prompt('Description',item?.description||'');if(description===null)return;
 const photoUrl=prompt('Photo URL (optional)',item?.photo_url||'');if(photoUrl===null)return;
 const available=confirm('Item is available?');
 api('upsert_menu_item',{id:item?.id,category_id:categoryId,name,price:Number(priceRaw),description,is_available:available,photo_url:photoUrl.trim()||null}).then(bootstrap).catch(e=>alert(e.message));
}
function deleteItem(id){if(!confirm('Delete this menu item?'))return;api('delete_menu_item',{id}).then(bootstrap).catch(e=>alert(e.message))}

function renderRooms(){
 const dates=nextDates(14);
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Hotel rooms</h3><div class="actions"><button onclick="openRoomForm()">+ Room type</button></div>'+
 (state.rooms.length?state.rooms.map(r=>'<div class="item"><div class="row"><strong>'+esc(r.name)+'</strong><span class="pill">'+r.total_rooms+' total</span></div><div class="muted">Capacity '+r.capacity+' · '+(r.public_price!=null?'ETB '+r.public_price:'Rate confirmed by hotel')+'</div><div class="actions"><button class="ghost" onclick="openRoomForm('+jsonArg(r)+')">Edit room</button><button class="danger" onclick="deleteRoom(\''+r.id+'\')">Delete</button></div><div class="inventory">'+dates.map(d=>{const x=state.inventory.find(v=>String(v.room_type_id)===String(r.id)&&v.inventory_date===d);const val=x?.available_rooms??r.total_rooms;return '<div class="day"><strong>'+d.slice(5)+'</strong><input id="a-'+r.id+'-'+d+'" type="number" min="0" max="'+r.total_rooms+'" value="'+val+'"><label><input id="b-'+r.id+'-'+d+'" type="checkbox" '+(x?.blocked?'checked':'')+'> Block</label><button class="ghost" onclick="saveInventory(\''+r.id+'\',\''+d+'\','+r.total_rooms+')">Save</button></div>'}).join('')+'</div></div>').join(''):'<div class="muted">No room types configured.</div>');
}
function openRoomForm(r=null){
 const name=prompt('Room type name',r?.name||'');if(name===null)return;
 const total=Number(prompt('Total rooms',r?.total_rooms??0));if(!Number.isInteger(total)||total<0)return alert('Invalid total rooms.');
 const capacity=Number(prompt('Guest capacity',r?.capacity??1));if(!Number.isInteger(capacity)||capacity<1)return alert('Invalid capacity.');
 const price=prompt('Public price in ETB (leave blank if hotel confirms rate)',r?.public_price??'');if(price===null)return;
 const description=prompt('Room description',r?.description||'');if(description===null)return;
 const beds=prompt('Beds',r?.beds||'');if(beds===null)return;
 const amenities=prompt('Amenities (comma separated)',(r?.amenities||[]).join(', '));if(amenities===null)return;
 const photoUrl=prompt('Room photo URL (optional)',r?.photo_url||'');if(photoUrl===null)return;
 api('upsert_room',{id:r?.id,name,total_rooms:total,capacity,public_price:price===''?null:Number(price),description,beds,amenities:amenities.split(',').map(x=>x.trim()).filter(Boolean),photo_url:photoUrl.trim()||null}).then(bootstrap).catch(e=>alert(e.message));
}
function deleteRoom(id){if(!confirm('Delete this room type?'))return;api('delete_room',{id}).then(bootstrap).catch(e=>alert(e.message))}
async function saveInventory(roomId,date,total){
 const value=Number(document.getElementById('a-'+roomId+'-'+date).value),blocked=document.getElementById('b-'+roomId+'-'+date).checked;
 if(!Number.isInteger(value)||value<0||value>total)return alert('Available rooms must be between 0 and '+total+'.');
 try{await api('update_inventory',{room_type_id:roomId,inventory_date:date,available_rooms:value,blocked});await bootstrap();showTab('rooms')}catch(e){alert(e.message)}
}
function nextDates(days){const a=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<days;i++){const x=new Date(d);x.setDate(x.getDate()+i);a.push(x.toISOString().slice(0,10))}return a}

function renderPromotions(){
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Promotions & posts</h3><p class="muted">Publish real offers only. Expired promotions should not remain active.</p><div class="actions"><button onclick="openPromoForm()">+ Promotion</button></div>'+
 (state.promotions.length?state.promotions.map(p=>'<div class="item"><div class="row"><strong>'+esc(p.title)+'</strong><span class="pill">'+esc(p.badge||p.status||'')+'</span></div><div class="muted">'+esc(p.description||'')+'</div><div class="muted">'+esc(p.starts_on||'')+' → '+esc(p.ends_on||'')+'</div><div class="actions"><button class="ghost" onclick="openPromoForm('+jsonArg(p)+')">Edit</button><button class="danger" onclick="deletePromo(\''+p.id+'\')">Delete</button></div></div>').join(''):'<div class="muted">No promotions yet.</div>');
}
function openPromoForm(p=null){
 const title=prompt('Promotion title',p?.title||'');if(title===null)return;
 const desc=prompt('Description',p?.description||'');if(desc===null)return;
 const badge=prompt('Badge: 25% OFF, TODAY, NEW, FEATURED, LIMITED, FINE TIME PICK',p?.badge||'');if(badge===null)return;
 const starts=prompt('Start date YYYY-MM-DD',p?.starts_on||'');if(starts===null)return;
 const ends=prompt('End date YYYY-MM-DD',p?.ends_on||'');if(ends===null)return;
 const imageUrl=prompt('Promotion image URL (optional)',p?.image_url||'');if(imageUrl===null)return;
 const terms=prompt('Terms (optional)',p?.terms||'');if(terms===null)return;
 api('upsert_promotion',{id:p?.id,title,description:desc,badge,starts_on:starts,ends_on:ends,status:'active',image_url:imageUrl.trim()||null,terms:terms.trim()||null}).then(bootstrap).catch(e=>alert(e.message));
}
function deletePromo(id){if(!confirm('Delete this promotion?'))return;api('delete_promotion',{id}).then(bootstrap).catch(e=>alert(e.message))}

function renderSettings(){
 const b=state.business||{},s=state.subscription;
 document.getElementById('content').innerHTML='<h3 class="sectionTitle">Business profile</h3>'+
 '<div class="grid"><div><label class="label">Business name</label><input id="bn" value="'+attr(b.name)+'"></div><div><label class="label">Phone</label><input id="bp" value="'+attr(b.phone)+'"></div></div>'+
 '<label class="label">About</label><textarea id="ba">'+esc(b.about||'')+'</textarea>'+
 '<div class="grid"><div><label class="label">Cover image URL</label><input id="bc" value="'+attr(b.cover_url)+'"></div><div><label class="label">Services (comma separated)</label><input id="bs" value="'+attr((b.services||[]).join(', '))+'"></div></div>'+
 '<label class="label">Gallery image URLs (comma separated)</label><textarea id="bg">'+esc((b.gallery_urls||[]).join(', '))+'</textarea>'+
 '<label class="label">Opening hours (JSON)</label><textarea id="bo">'+esc(typeof b.opening_hours==='string'?b.opening_hours:JSON.stringify(b.opening_hours||{},null,2))+'</textarea>'+
 '<label class="label">Highlights (comma separated)</label><input id="bh" value="'+attr((b.highlights||[]).join(', '))+'">'+
 '<label class="label">Amenities (comma separated)</label><input id="bam" value="'+attr((b.amenities||[]).join(', '))+'">'+
 '<div class="actions"><button onclick="saveBusiness()">Save business profile</button></div>'+
 '<div class="item"><strong>Subscription</strong><div class="muted">'+esc(s?.plan||'Not configured')+' · '+esc(s?.status||'Contact FineTime')+(s?.monthly_price!=null?' · ETB '+s.monthly_price+'/month':'')+'</div><div class="muted">Plan changes are requested here; FineTime controls activation, price and billing until online billing is integrated.</div><div class="actions"><button class="ghost" onclick="requestPlanChange()">Request plan change</button></div></div>';
}
async function saveBusiness(){
 const csv=id=>document.getElementById(id).value.split(',').map(x=>x.trim()).filter(Boolean);
 let opening={};
 try{opening=JSON.parse(document.getElementById('bo').value||'{}')}catch(e){return alert('Opening hours must be valid JSON.')}
 try{
  await api('update_business',{name:document.getElementById('bn').value,phone:document.getElementById('bp').value,about:document.getElementById('ba').value,cover_url:document.getElementById('bc').value,gallery_urls:csv('bg'),services:csv('bs'),opening_hours:opening,highlights:csv('bh'),amenities:csv('bam')});
  await bootstrap();
  showTab('overview');
 }catch(e){alert(e.message||'Could not save business profile.')}
}
function requestPlanChange(){
 const plan=prompt('Requested plan: basic or premium',state.subscription?.plan||'basic');
 if(plan===null)return;
 const normalized=plan.trim().toLowerCase();
 if(!['basic','premium'].includes(normalized))return alert('Choose basic or premium.');
 const notes=prompt('Optional note to FineTime Admin','Please review my subscription request.');
 if(notes===null)return;
 api('request_subscription_change',{plan:normalized,notes}).then(d=>{alert(d.message||'Subscription request sent to FineTime.');bootstrap()}).catch(e=>alert(e.message));
}

function jsonArg(x){return encodeURIComponent(JSON.stringify(x)).replace(/'/g,'%27')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function attr(s){return esc(s||'').replace(/\n/g,' ')}
function decodeArg(s){try{return JSON.parse(decodeURIComponent(s))}catch{return null}}
// Form helpers are intentionally named differently from their public click handlers
// so edit/add actions cannot recurse through a window-level wrapper.
window.openItemForm=openItemForm;
window.openRoomForm=openRoomForm;
window.openPromoForm=openPromoForm;

bootstrap();
</script>
</body>
</html>
