<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FineTime Business</title>
<meta name="description" content="FineTime public hospitality business profile.">
<style>
:root{--bg:#0c0a06;--surface:#111518;--card:#15191b;--line:#252a2d;--gold:#e3a82d;--gold2:#f2c45b;--ivory:#f5f1e8;--muted:#8f9799;--cream:#d9d1c3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ivory);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}
.wrap{max-width:760px;margin:auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:20;background:rgba(12,10,6,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px;margin:0 -16px 0;display:flex;align-items:center;justify-content:space-between}
.brand{color:var(--gold);font-weight:900;letter-spacing:3px}.top a{font-size:12px;color:var(--gold2);font-weight:800}
.hero{padding:16px 0 0}.cover{width:100%;height:min(56vw,430px);min-height:250px;object-fit:cover;border-radius:24px;background:#17130d}.hero h1{font:800 clamp(32px,8vw,48px)/1.05 Georgia,serif;margin:20px 0 8px}.meta{color:var(--muted);margin:0}.badge{display:inline-flex;padding:6px 11px;border:1px solid #e3a82d55;border-radius:999px;color:var(--gold2);font-size:10px;font-weight:900;letter-spacing:1.5px;margin-top:14px}.about{color:var(--cream);font-size:14px;margin:14px 0 0}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px 14px;border-radius:16px;border:1px solid #ffffff12;background:var(--card);color:var(--ivory);font-weight:800}.btn.primary{background:linear-gradient(135deg,#f2c45b,#d99c1e);color:#171107;border:0}.btn:disabled{opacity:.35}
.tabs{position:sticky;top:57px;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(9,11,12,.96);border-bottom:1px solid var(--line);margin:20px -16px 0;padding:0 8px}.tab{border:0;background:none;color:#777f82;min-height:58px;font-size:12px;font-weight:700;position:relative}.tab.active{color:var(--gold2)}.tab.active:after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:3px;border-radius:3px;background:var(--gold)}
.panel{padding-top:24px}.section-title{font:800 26px/1.15 Georgia,serif;margin:0 0 16px}.section-label{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.info,.item,.review,.promo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}.info strong{display:block;color:var(--gold);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}.muted{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:999px;background:#171b1d;border:1px solid #ffffff12;color:#d6d0c7}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;height:170px;object-fit:cover;border-radius:16px;background:#17130d}.empty{padding:40px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:18px}
.item{display:flex;gap:13px;margin-bottom:10px}.thumb{width:82px;height:82px;border-radius:14px;object-fit:cover;background:#211b11;flex:none}.item h3,.promo h3{margin:0;font-size:16px}.price{color:var(--gold2);font-weight:900;white-space:nowrap}.review{margin-bottom:10px}.stars{color:var(--gold2);font-weight:900}.review-date{float:right;color:var(--muted);font-size:11px}.promo{margin-bottom:10px}.room{display:flex;gap:12px;margin-bottom:10px}.room .thumb{width:100px;height:100px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,18,18,.96);backdrop-filter:blur(16px);border-top:1px solid #ffffff12;padding:8px max(8px,calc((100% - 760px)/2 + 8px));display:flex;gap:6px}.bottom .btn{flex:1;min-height:48px;font-size:11px;background:transparent;border:0}
.hidden{display:none!important}
@media(min-width:700px){.wrap{padding-left:0;padding-right:0}.top,.tabs{margin-left:0;margin-right:0}.grid2{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:repeat(4,1fr)}.gallery{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="./">FINETIME</a><a href="/finetime/">Open FineTime App →</a></header>
<main id="root">
  <section class="hero">
    <div class="empty">Loading business profile…</div>
  </section>
</main>
</div>
<nav class="bottom" id="bottomActions"></nav>
<script>
const U='https://atewcbkuzrnfnmzsylze.supabase.co',K='sb_publishable_CxfreIiozKEB-GcvNOCyhQ_RVnIgGVG';
const id=new URLSearchParams(location.search).get('id'), H={apikey:K,Authorization:'Bearer '+K};
let B={},ROOMS=[],CATS=[],PROMOS=[],REVIEWS=[],tab='about';
const root=document.getElementById('root'),bottom=document.getElementById('bottomActions');
async function get(path,timeoutMs=9000){
 const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),timeoutMs);
 try{
  const r=await fetch(U+'/rest/v1/'+path,{headers:H,cache:'no-store',signal:ctl.signal});
  if(!r.ok)throw new Error('Request failed');
  return await r.json();
 }finally{clearTimeout(timer)}
}
async function safeGet(path,fallback){
 try{return await get(path)}catch(_){return fallback}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function arr(v){return Array.isArray(v)?v.filter(x=>String(x??'').trim()).map(x=>String(x).trim()):[]}
function avg(){if(!REVIEWS.length)return null;return (REVIEWS.reduce((s,r)=>s+Number(r.rating||0),0)/REVIEWS.length).toFixed(1)}
function img(url,cls){return url?'<img class="'+(cls||'thumb')+'" src="'+esc(url)+'" loading="lazy" onerror="this.style.display=\'none\'">':''}
function chips(list){const a=arr(list);return a.length?'<div class="chips">'+a.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':''}
function hours(){
 const h=B.opening_hours;
 if(!h||typeof h!=='object')return '<div class="empty">Opening hours have not been published yet.</div>';
 const keys=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
 return '<div class="grid2">'+keys.map(k=>'<div class="info"><strong>'+k+'</strong><span>'+esc(typeof h[k]==='string'?h[k]:JSON.stringify(h[k]||'Closed'))+'</span></div>').join('')+'</div>';
}
function reviews(){
 if(!REVIEWS.length)return '<div class="empty">No reviews have been published yet.</div>';
 return REVIEWS.map(r=>'<article class="review"><span class="stars">★ '+esc(r.rating||0)+'</span><span class="review-date">'+esc(String(r.created_at||'').slice(0,10))+'</span><p>'+esc(r.body||'Rated experience')+'</p></article>').join('');
}
function gallery(){
 const g=arr(B.gallery_urls); if(!g.length)return '<div class="empty">Gallery photos have not been published yet.</div>';
 return '<div class="gallery">'+g.map(x=>'<img src="'+esc(x)+'" loading="lazy" alt="'+esc(B.name||'FineTime business')+'">').join('')+'</div>';
}
function highlights(){
 const a=arr(B.highlights),am=arr(B.amenities),s=arr(B.services);
 return '<div class="section-label">What to expect</div><h2 class="section-title">Highlights & services</h2>'+
   (a.length?'<h3>Highlights</h3>'+chips(a):'<p class="muted">No highlights published yet.</p>')+
   (am.length?'<h3>Amenities</h3>'+chips(am):'')+
   (s.length?'<h3>Services</h3>'+chips(s):'');
}
function menuPreview(){
 if(!CATS.length)return '';
 return '<div class="section-label">Dining</div><h2 class="section-title">Menu</h2>'+
 CATS.map(c=>{const items=(Array.isArray(c.menu_items)?c.menu_items:[]).filter(x=>x.is_available!==false);return items.length?'<div class="item"><div style="flex:1"><h3>'+esc(c.name)+'</h3><p class="muted">'+items.slice(0,4).map(x=>esc(x.name)+' · ETB '+esc(x.price??'—')).join('<br>')+'</p></div></div>':''}).join('')+
 '<a class="btn primary" href="menu.html?id='+encodeURIComponent(id)+'">Open full digital menu</a>';
}
function rooms(){
 if(!ROOMS.length)return '';
 return '<div class="section-label">Stay</div><h2 class="section-title">Rooms</h2>'+ROOMS.map(r=>'<article class="item room">'+img(r.photo_url)+
 '<div style="flex:1"><h3>'+esc(r.name||'Room')+'</h3><p class="muted">'+esc((r.description||'')+' '+(r.capacity?('· '+r.capacity+' guests'):'')+(r.beds?' · '+r.beds:''))+'</p>'+
 '<div class="price">'+(r.public_price!=null?'ETB '+esc(r.public_price)+' / night':'Rate confirmed by hotel')+'</div></div></article>').join('');
}
function promos(){
 if(!PROMOS.length)return '';
 return '<div class="section-label">Featured</div><h2 class="section-title">Promotions</h2>'+PROMOS.map(p=>'<article class="promo"><span class="badge">'+esc(p.badge||'FEATURED')+'</span><h3>'+esc(p.title||'Special offer')+'</h3><p class="muted">'+esc(p.description||'')+'</p></article>').join('');
}
function panel(){
 let body='';
 if(tab==='about') body='<div class="section-label">About</div><h2 class="section-title">The experience</h2><p class="about">'+esc(B.about||'This FineTime partner has not published an about description yet.')+'</p><div class="grid2" style="margin-top:18px"><div class="info"><strong>Location</strong><span>'+esc(B.cities?.name||'Ethiopia')+'</span></div><div class="info"><strong>Category</strong><span>'+esc((B.category||'hospitality').replace(/^./,x=>x.toUpperCase()))+'</span></div></div>'+menuPreview()+rooms()+promos();
 if(tab==='highlights') body=highlights();
 if(tab==='gallery') body='<div class="section-label">Gallery</div><h2 class="section-title">See the place</h2>'+gallery();
 if(tab==='hours') body='<div class="section-label">Hours</div><h2 class="section-title">When to visit</h2>'+hours();
 if(tab==='reviews') body='<div class="section-label">Guest voice</div><h2 class="section-title">'+REVIEWS.length+' review'+(REVIEWS.length===1?'':'s')+'</h2>'+reviews();
 return '<div class="tabs">'+['about','highlights','gallery','hours','reviews'].map(t=>'<button class="tab '+(tab===t?'active':'')+'" onclick="selectTab(\''+t+'\')">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div><section class="panel">'+body+'</section>';
}
function selectTab(t){tab=t;render()}
function render(){
 const rating=avg(), cover=B.cover_url||'';
 root.innerHTML='<section class="hero">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(B.name)+'">':'<div class="empty">FineTime business profile</div>')+
 '<span class="badge">'+esc((B.category||'hospitality').toUpperCase())+'</span><h1>'+esc(B.name||'FineTime place')+'</h1>'+
 '<p class="meta">'+esc(B.cities?.name||'')+(rating?' · ★ '+rating+' · '+REVIEWS.length+' review'+(REVIEWS.length===1?'':'s'):'')+'</p>'+
 '<p class="about">'+esc(B.about||'')+'</p>'+
 '<div class="actions"><a class="btn primary" href="menu.html?id='+encodeURIComponent(id)+'">Digital Menu</a>'+
 '<a class="btn" href="'+(B.phone?'tel:'+esc(B.phone):'#')+'">Call</a>'+
 '<a class="btn" target="_blank" rel="noopener" href="'+(B.lat!=null&&B.lng!=null?'https://maps.google.com/?q='+encodeURIComponent(B.lat+','+B.lng):'#')+'">Directions</a>'+
 '<a class="btn" href="/finetime/">Open App</a></div>'+panel()+'</section>';
 bottom.innerHTML=(B.phone?'<a class="btn" href="tel:'+esc(B.phone)+'">☎ Call</a>':'')+
 (B.lat!=null&&B.lng!=null?'<a class="btn" target="_blank" rel="noopener" href="https://maps.google.com/?q='+encodeURIComponent(B.lat+','+B.lng)+'">⌖ Directions</a>':'')+
 '<a class="btn primary" href="'+(B.category==='hotel'?'#':'menu.html?id='+encodeURIComponent(id))+'">'+(B.category==='hotel'?'Book':'Order')+'</a>';
}
async function load(){
 if(!id){location.href='./';return}
 try{
  // Render the critical business row first. Do not make rooms, menus,
  // promotions, reviews, or the city relationship block the profile.
  const biz=await get('businesses?select=*&id=eq.'+encodeURIComponent(id)+'&is_published=eq.true');
  if(!biz.length){root.innerHTML='<div class="empty">This business profile is not available.</div>';return}
  B=biz[0];
  document.title=B.name+' — FineTime';
  render();

  const cityId=B.city_id;
  const [city,roomsData,cats,promos,reviewsData]=await Promise.all([
   cityId?safeGet('cities?select=name&id=eq.'+encodeURIComponent(cityId),[]):Promise.resolve([]),
   safeGet('room_types?select=*&business_id=eq.'+encodeURIComponent(id),[]),
   safeGet('menu_categories?select=*,menu_items(*)&business_id=eq.'+encodeURIComponent(id)+'&order=sort_order',[]),
   safeGet('promotions?select=*&business_id=eq.'+encodeURIComponent(id)+'&status=eq.active&order=starts_on',[]),
   safeGet('reviews?select=rating,body,created_at&business_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc',[])
  ]);
  B.cities=city[0]||null;
  ROOMS=roomsData;CATS=cats;PROMOS=promos;REVIEWS=reviewsData;
  render();
 }catch(e){
  root.innerHTML='<div class="empty"><h2>Unable to load this profile</h2><p>Please refresh and try again.</p></div>';
 }
}
load();
</script>
</body>
</html>
