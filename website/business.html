<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FineTime Business</title>
<meta name="description" content="FineTime public business profile."><style>body{margin:0;background:#121212;color:#f5f1e8;font:16px system-ui;padding:30px}main{max-width:800px;margin:auto}.brand{color:#c9a227;font-weight:900;letter-spacing:4px}img{width:100%;max-height:360px;object-fit:cover;border-radius:18px;margin:20px 0}.card{background:#1b1b1b;padding:20px;border-radius:18px;margin-top:16px}.muted{color:#a0a0a0}.btn{display:inline-block;padding:12px 18px;border-radius:12px;background:#c9a227;color:#121212;font-weight:800;text-decoration:none}</style></head>
<body><main><a class="brand" href="./">FINETIME</a><div id="root" class="card">Loading…</div></main>
<script>
const U='__SUPABASE_URL__',K='__SUPABASE_ANON_KEY__',id=new URLSearchParams(location.search).get('id');
async function load(){if(!id){location.href='./';return}try{const r=await fetch(U+'/rest/v1/businesses?select=*,cities(name)&id=eq.'+encodeURIComponent(id)+'&is_published=eq.true',{headers:{apikey:K,Authorization:'Bearer '+K}});const a=await r.json();if(!a.length){root.innerHTML='<h2>Business not found</h2><p class="muted">This public page is unavailable.</p>';return}const b=a[0];document.title=b.name+' — FineTime';root.innerHTML=(b.cover_url?'<img src="'+esc(b.cover_url)+'" alt="">':'')+'<h1>'+esc(b.name)+'</h1><p class="muted">'+esc((b.category||'').toUpperCase())+' · '+esc(b.cities?.name||'')+'</p><p>'+esc(b.about||'')+'</p>'+(b.phone?'<p>Phone: '+esc(b.phone)+'</p>':'')+'<a class="btn" href="menu.html?id='+encodeURIComponent(id)+'">View Digital Menu</a> <a class="btn" href="../">Open FineTime App</a>'}catch(e){root.innerHTML='<h2>Unable to load this page</h2><p class="muted">Please try again later.</p>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();
</script></body></html>
