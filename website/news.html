<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FineTime News</title><style>body{margin:0;background:#121212;color:#f5f1e8;font:16px system-ui}main{max-width:900px;margin:auto;padding:24px}.brand{color:#c9a227;font-weight:900;letter-spacing:4px}.card{background:#1b1b1b;border:1px solid #fff1;border-radius:15px;padding:18px;margin:14px 0}.muted{color:#aaa}img{max-width:100%;max-height:360px;border-radius:12px}</style></head><body><main><a class="brand" href="./">FINETIME</a><h1>News</h1><p class="muted">FineTime updates and hospitality stories.</p><div id="list" class="muted">Loading…</div></main><script>
const U='__SUPABASE_URL__',K='__SUPABASE_ANON_KEY__',e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function loadNews(){
 try{
  const r=await fetch(U+'/rest/v1/news?select=*&is_published=eq.true&order=published_at.desc&_ft='+Date.now(),{cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const a=await r.json();
  list.innerHTML=a.length?a.map(n=>'<article class="card">'+(n.cover_url?'<img src="'+e(n.cover_url)+'">':'')+'<h2>'+e(n.title)+'</h2><p class="muted">'+e(n.published_at?new Date(n.published_at).toLocaleDateString():'')+'</p><p>'+e(n.summary||'')+'</p><div>'+e(n.body||'').replace(/\n/g,'<br>')+'</div></article>').join(''):'<div class="card">No published news yet.</div>';
 }catch(_){list.innerHTML='<div class="card">News is temporarily unavailable.</div>'}
}
loadNews();setInterval(loadNews,5000);
</script></body></html>
