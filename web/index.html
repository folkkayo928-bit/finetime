<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FineTime — Discover. Dine. Stay. Curated hospitality in Ethiopia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FineTime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FineTime — Discover. Dine. Stay.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      margin: 0;
      background-color: #0A0B0E;
      color: #F7F5F0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      background: #0A0B0E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .splash-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #D4AF37;
      margin-bottom: 20px;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .splash-text {
      margin-top: 14px;
      color: #9EA6B5;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-logo">FINETIME</div>
    <div class="splash-spinner"></div>
    <div class="splash-text">Loading experiences…</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('loading-splash');
      var timedOut = false;

      function removeSplash() {
        if (!splash || !splash.parentNode) return;
        splash.style.opacity = '0';
        window.setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }

      // The splash must disappear only after Flutter has actually painted.
      // This prevents a blank/black page from being exposed prematurely.
      window.addEventListener('flutter-first-frame', removeSplash);

      // If Flutter has not produced a frame after 12 seconds, show a useful
      // recovery action instead of fading to an unexplained black screen.
      window.setTimeout(function () {
        if (!splash || !splash.parentNode || timedOut) return;
        timedOut = true;
        var spinner = splash.querySelector('.splash-spinner');
        var text = splash.querySelector('.splash-text');
        if (spinner) spinner.style.display = 'none';
        if (text) {
          text.innerHTML =
            'FineTime is taking longer than expected.<br>' +
            '<button onclick="window.location.reload()" ' +
            'style="margin-top:16px;padding:11px 18px;border:0;border-radius:22px;' +
            'background:#D4AF37;color:#17120A;font-weight:800;cursor:pointer;">' +
            'Reload FineTime</button>';
        }
      }, 12000);

      // Surface bootstrap-level JavaScript errors instead of leaving a blank
      // canvas with no explanation.
      window.addEventListener('error', function () {
        if (!splash || !splash.parentNode) return;
        var text = splash.querySelector('.splash-text');
        if (text && !timedOut) {
          text.textContent = 'FineTime could not finish loading. Please reload.';
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
