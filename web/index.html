<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FineTime — Discover. Dine. Stay. Curated hospitality in Ethiopia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FineTime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FineTime — Discover. Dine. Stay.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      margin: 0;
      background-color: #0A0B0E;
      color: #F7F5F0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      background: #0A0B0E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .splash-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #D4AF37;
      margin-bottom: 20px;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .splash-text {
      margin-top: 14px;
      color: #9EA6B5;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-logo">FINETIME</div>
    <div class="splash-spinner"></div>
    <div class="splash-text">Loading experiences…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
